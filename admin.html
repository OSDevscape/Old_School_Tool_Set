<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSTS — Owner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --surface2:#21262d;
      --gold:    #b88848;
      --gold2:   #d0a060;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --border:  #30363d;
      --red:     #da3633;
      --green:   #238636;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Login ────────────────────────────────────────────────────────────── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .login-card {
      width: 100%;
      max-width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
    }

    .login-card h1 {
      color: var(--gold);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .login-card .sub {
      color: var(--muted);
      font-size: 11px;
      margin: 4px 0 28px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ── Admin shell ──────────────────────────────────────────────────────── */
    #admin-screen { display: none; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .brand { color: var(--gold); font-weight: 700; font-size: 16px; letter-spacing: 1px; }
    header .brand span { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }

    .main { max-width: 860px; margin: 0 auto; padding: 28px 20px; }

    /* ── Search ───────────────────────────────────────────────────────────── */
    .search-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    /* ── User cards ───────────────────────────────────────────────────────── */
    .user-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }

    .user-card .user-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .user-card .username {
      font-size: 16px;
      font-weight: 600;
      color: var(--gold2);
    }

    .user-card .meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .user-card .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .action-row label {
      font-size: 11px;
      color: var(--muted);
      width: 70px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .user-card .status {
      font-size: 11px;
      min-height: 14px;
      margin-top: 8px;
    }

    .status.ok   { color: var(--green); }
    .status.err  { color: var(--red); }

    /* ── Empty / loading states ───────────────────────────────────────────── */
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 0;
      font-size: 13px;
    }

    /* ── Shared controls ──────────────────────────────────────────────────── */
    input[type="text"],
    input[type="password"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
      transition: border-color .15s;
    }

    input:focus { border-color: var(--gold); }

    button {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      padding: 8px 14px;
      transition: background .15s, border-color .15s;
      white-space: nowrap;
    }

    button:hover { background: var(--gold); color: #111; border-color: var(--gold); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    button.primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #111;
      font-weight: 600;
    }

    button.primary:hover { background: var(--gold2); border-color: var(--gold2); }

    button.danger {
      background: transparent;
      border-color: var(--red);
      color: var(--red);
    }

    button.danger:hover { background: var(--red); color: #fff; border-color: var(--red); }

    #error-global { color: var(--red); font-size: 12px; min-height: 16px; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>

<!-- ── Login ────────────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <h1>OSTS</h1>
    <div class="sub">Owner Access</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <input id="login-password" type="password" placeholder="Owner password" autocomplete="current-password">
      <div id="error-global"></div>
      <button class="primary" id="login-btn">Enter</button>
    </div>
  </div>
</div>

<!-- ── Admin shell ───────────────────────────────────────────────────────────── -->
<div id="admin-screen">
  <header>
    <div class="brand">OSTS <span>Owner Panel</span></div>
    <button id="logout-btn" style="font-size:12px;padding:6px 12px">Log Out</button>
  </header>

  <div class="main">

    <!-- Search -->
    <div class="search-row">
      <input id="search-input" type="text" placeholder="Search by username…" autocomplete="off">
      <button class="primary" id="search-btn">Search</button>
    </div>

    <!-- Results -->
    <div id="results-container">
      <div class="empty">Search for a username to get started.</div>
    </div>

  </div>
</div>

<script>
const API = '/.netlify/functions/admin';
const TOKEN_KEY = 'osts_admin_token';

// ── State ─────────────────────────────────────────────────────────────────────
let adminToken = sessionStorage.getItem(TOKEN_KEY) || null;

// ── Boot ──────────────────────────────────────────────────────────────────────
(function boot() {
  if (adminToken) showAdmin();
})();

// ── Helpers ───────────────────────────────────────────────────────────────────
async function api(payload) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function showAdmin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-screen').style.display = 'block';
  document.getElementById('search-input').focus();
}

function showLogin() {
  adminToken = null;
  sessionStorage.removeItem(TOKEN_KEY);
  document.getElementById('admin-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-password').value = '';
  document.getElementById('error-global').textContent = '';
}

function setError(el, msg) {
  if (typeof el === 'string') el = document.getElementById(el);
  if (el) { el.textContent = msg; el.className = 'status err'; }
}

function setOk(el, msg) {
  if (typeof el === 'string') el = document.getElementById(el);
  if (el) { el.textContent = msg; el.className = 'status ok'; }
}

// ── Login ─────────────────────────────────────────────────────────────────────
document.getElementById('login-btn').addEventListener('click', async () => {
  const password = document.getElementById('login-password').value;
  const errEl    = document.getElementById('error-global');
  errEl.textContent = '';
  if (!password) { errEl.textContent = 'Enter password.'; return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = '⏳';
  try {
    const data = await api({ action: 'login', password });
    adminToken = data.token;
    sessionStorage.setItem(TOKEN_KEY, adminToken);
    showAdmin();
  } catch (e) {
    errEl.textContent = e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Enter';
  }
});

document.getElementById('login-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('login-btn').click();
});

// ── Logout ────────────────────────────────────────────────────────────────────
document.getElementById('logout-btn').addEventListener('click', showLogin);

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('search-btn').addEventListener('click', doSearch);
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

async function doSearch() {
  const query = document.getElementById('search-input').value.trim();
  if (!query) return;
  const container = document.getElementById('results-container');
  container.innerHTML = '<div class="empty">Searching…</div>';
  try {
    const data = await api({ action: 'search', token: adminToken, query });
    if (data.users.length === 0) {
      container.innerHTML = '<div class="empty">No users found.</div>';
      return;
    }
    container.innerHTML = data.users.map(u => buildUserCard(u)).join('');
    attachCardListeners();
  } catch (e) {
    if (e.message.includes('expired') || e.message.includes('Invalid')) { showLogin(); return; }
    container.innerHTML = `<div class="empty" style="color:var(--red)">${e.message}</div>`;
  }
}

// ── User card builder ─────────────────────────────────────────────────────────
function buildUserCard(u) {
  const created = u.created_at
    ? new Date(u.created_at).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })
    : 'Unknown';

  return `
  <div class="user-card" data-user-id="${u.id}">
    <div class="user-header">
      <div>
        <div class="username">${escHtml(u.username)}</div>
        <div class="meta">ID: ${u.id} · Joined ${created}</div>
      </div>
    </div>

    <div class="actions">
      <!-- Rename -->
      <div class="action-row">
        <label>Username</label>
        <input type="text" class="new-username-input" value="${escHtml(u.username)}" maxlength="20" autocomplete="off">
        <button class="rename-btn">Save</button>
      </div>

      <!-- Password -->
      <div class="action-row">
        <label>Password</label>
        <input type="password" class="new-password-input" placeholder="New password…" maxlength="64" autocomplete="off">
        <button class="password-btn">Set</button>
      </div>

      <!-- Delete -->
      <div class="action-row">
        <label>Account</label>
        <button class="danger delete-btn" style="width:100%">Delete Account</button>
      </div>
    </div>

    <div class="status" id="card-status-${u.id}"></div>
  </div>`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Card listeners ────────────────────────────────────────────────────────────
function attachCardListeners() {
  document.querySelectorAll('.user-card').forEach(card => {
    const userId   = card.dataset.userId;
    const statusEl = document.getElementById(`card-status-${userId}`);

    // Rename
    card.querySelector('.rename-btn').addEventListener('click', async () => {
      const newUsername = card.querySelector('.new-username-input').value.trim();
      const btn = card.querySelector('.rename-btn');
      btn.disabled = true; btn.textContent = '⏳';
      try {
        await api({ action: 'update_username', token: adminToken, userId, newUsername });
        setOk(statusEl, `✅ Username updated to "${newUsername}"`);
        card.querySelector('.username').textContent = newUsername;
        card.dataset.userId = userId; // unchanged
      } catch (e) {
        setError(statusEl, e.message);
      } finally { btn.disabled = false; btn.textContent = 'Save'; }
    });

    // Password
    card.querySelector('.password-btn').addEventListener('click', async () => {
      const newPassword = card.querySelector('.new-password-input').value;
      const btn = card.querySelector('.password-btn');
      btn.disabled = true; btn.textContent = '⏳';
      try {
        await api({ action: 'update_password', token: adminToken, userId, newPassword });
        setOk(statusEl, '✅ Password updated. Their sessions have been cleared.');
        card.querySelector('.new-password-input').value = '';
      } catch (e) {
        setError(statusEl, e.message);
      } finally { btn.disabled = false; btn.textContent = 'Set'; }
    });

    // Delete
    card.querySelector('.delete-btn').addEventListener('click', async () => {
      const username = card.querySelector('.username').textContent;
      if (!confirm(`Permanently delete "${username}"? This cannot be undone.`)) return;
      const btn = card.querySelector('.delete-btn');
      btn.disabled = true; btn.textContent = '⏳ Deleting…';
      try {
        await api({ action: 'delete_user', token: adminToken, userId });
        card.style.opacity = '0.4';
        card.style.pointerEvents = 'none';
        setOk(statusEl, `✅ Account deleted.`);
      } catch (e) {
        setError(statusEl, e.message);
        btn.disabled = false; btn.textContent = 'Delete Account';
      }
    });
  });
}
</script>
</body>
</html>
