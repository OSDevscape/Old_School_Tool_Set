<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2b241b">
  <link rel="manifest" href="../manifest.json">
  <title>OSTS — Gains</title>
  <link rel="stylesheet" href="../style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .sp-profile-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 11px; padding: 10px 12px; margin-bottom: 6px;
      display: flex; align-items: center; gap: 10px;
    }
    .sp-profile-card.active { border-color: var(--gold); }
    .sp-avatar {
      width: 34px; height: 34px; flex-shrink: 0; background: var(--surface3);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 17px;
    }
    .sp-info { flex: 1; min-width: 0; }
    .sp-nickname { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-rsn-type { font-size: 11px; color: var(--muted); }
    .sp-btn {
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text); font-size: 11px; font-weight: 600;
      padding: 5px 9px; cursor: pointer; transition: border-color .15s;
    }
    .sp-btn:hover { border-color: var(--gold); }
  </style>
</head>
<body>

<header>
  <h1>OSTS</h1>
  <div class="hdr-actions">
    <button id="install-btn">Install</button>
    <button class="hdr-btn icon-btn" id="settings-btn">⚙️</button>
  </div>
</header>

<div id="settings-overlay"></div>
<div id="settings-panel" aria-hidden="true">
  <div class="settings-head">
    <h2>Settings</h2>
    <button class="settings-close" id="settings-close">✕</button>
  </div>
  <div class="settings-block">
    <div class="settings-label">Appearance</div>
    <div class="theme-options">
      <button class="theme-chip" data-theme="dark">Dark</button>
      <button class="theme-chip" data-theme="light">Light</button>
      <button class="theme-chip" data-theme="brown">Brown</button>
    </div>
  </div>
  <div class="settings-block">
    <div class="settings-label">Player Profiles</div>
    <div id="sp-profile-list"></div>
  </div>
</div>

<div id="main">
  <div class="page active" id="page-gains">
    <div class="source-row">
      <span class="source-chip wom">Wise Old Man</span>
    </div>
    <div id="loader"></div>
    <div class="error-msg" id="error-msg"></div>
    <div class="welcome" id="welcome-msg">
      <div class="welcome-icon">📈</div>
      <p>Select a profile to view XP gains and progress charts.</p>
    </div>
    <div id="gains-content" style="display:none">
      <div class="period-tabs">
        <button class="period-tab active" data-period="day">Day</button>
        <button class="period-tab" data-period="week">Week</button>
        <button class="period-tab" data-period="month">Month</button>
        <button class="period-tab" data-period="year">Year</button>
      </div>
      <div class="data-label">XP Gains</div>
      <div id="gains-grid" class="gains-grid"></div>
      <div style="margin-top:16px">
        <div class="data-label">Progress Charts</div>
        <div class="chart-section">
          <div class="chart-wrap"><canvas id="chart-timeline" height="200"></canvas></div>
        </div>
        <div class="chart-section">
          <h3>Current Skill Levels</h3>
          <div class="chart-wrap"><canvas id="chart-levels" height="200"></canvas></div>
        </div>
      </div>
    </div>
  </div>
</div>

<nav id="bottom-nav"></nav>

<div class="modal-overlay" id="more-menu-overlay">
  <div class="modal-sheet">
    <div class="modal-head">
      <div><div class="modal-title">More</div></div>
      <button class="modal-close" id="more-menu-close">✕</button>
    </div>
    <div class="modal-actions">
      <a class="modal-action" href="bossing.html">🏆 Bossing</a>
      <a class="modal-action" href="timers.html">⏱ Timers</a>
      <a class="modal-action" href="bestiary.html">🐉 Bestiary</a>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import {
  initPage, fetchPlayer, player, wom, settings, showToast, storage,
  STORAGE_KEYS, SKILLS, SKILL_MAP, fmtXP, normalizeAccountType,
} from '../JS/shared.js';

initPage('gains');

let currentPeriod = 'week';
let currentRsn    = '';
let chartTimeline = null;
let chartLevels   = null;

// ── Profile system ────────────────────────────────────────────────────────────
const PROFILES_KEY    = 'osts_profiles_v2';
const ACTIVE_PROF_KEY = 'osts_active_profile_v2';
const SP_ICONS  = { ironman:'🛡', hardcore:'💀', ultimate:'🔱', regular:'⚔', gim:'👥', ghcim:'☠', ugim:'👥' };
const SP_LABELS = { ironman:'Iron', hardcore:'HCIM', ultimate:'UIM', regular:'Regular', gim:'GIM', ghcim:'GHCIM', ugim:'UGIM' };

function getProfiles() { return storage.get(PROFILES_KEY, []); }
function getActiveId() { return storage.get(ACTIVE_PROF_KEY, null); }
function setActiveId(id) { storage.set(ACTIVE_PROF_KEY, id); }
function norm(t) { return normalizeAccountType(t); }

function renderProfilePanel() {
  const list = document.getElementById('sp-profile-list');
  if (!list) return;
  const profiles = getProfiles();
  const activeId = getActiveId();
  if (!profiles.length) {
    list.innerHTML = '<div style="font-size:12px;color:var(--muted)">No saved profiles.<br>Go to <a href="overview.html" style="color:var(--gold)">Overview</a> to create one.</div>';
    return;
  }
  const sorted = [...profiles].sort((a, b) => (b.id === activeId) - (a.id === activeId));
  list.innerHTML = sorted.map(p => `
    <div class="sp-profile-card${p.id === activeId ? ' active' : ''}">
      <div class="sp-avatar">${SP_ICONS[norm(p.type)] || '⚔'}</div>
      <div class="sp-info">
        <div class="sp-nickname">${p.nickname}</div>
        <div class="sp-rsn-type">${p.rsn} · ${SP_LABELS[norm(p.type)] || 'Iron'}</div>
      </div>
      ${p.id !== activeId
        ? `<button class="sp-btn" data-load="${p.id}">Load</button>`
        : '<span style="font-size:10px;color:var(--gold)">Active</span>'}
    </div>`).join('');

  list.querySelectorAll('[data-load]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = getProfiles().find(x => x.id === btn.dataset.load);
      if (!p) return;
      setActiveId(p.id);
      storage.set(STORAGE_KEYS.ACCOUNT_TYPE, norm(p.type));
      storage.set(STORAGE_KEYS.RSN, p.rsn);
      settings.close();
      loadPlayer(p.rsn, norm(p.type));
    });
  });
}

document.getElementById('settings-btn')
  ?.addEventListener('click', renderProfilePanel, true);

// ── Period tabs ───────────────────────────────────────────────────────────────
document.querySelectorAll('.period-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = btn.dataset.period;
    if (currentRsn) loadGains(currentRsn, currentPeriod);
  });
});

// ── Load player ───────────────────────────────────────────────────────────────
async function loadPlayer(rsn, accountType) {
  if (!rsn) rsn = storage.get(STORAGE_KEYS.RSN, '');
  if (!rsn) return;
  if (!accountType) accountType = storage.get(STORAGE_KEYS.ACCOUNT_TYPE, 'ironman');
  setLoading(true); clearError();
  try {
    const data = await fetchPlayer(rsn, accountType);
    player.set(data);
    currentRsn = data.displayName || data.username || rsn;
    document.getElementById('player-name-header')
      && (document.getElementById('player-name-header').textContent = ' — ' + currentRsn);
    renderLevelsChart(data);
    await loadGains(currentRsn, currentPeriod);
    showToast('✅ ' + currentRsn);
  } catch (err) { showError(err.message); }
  finally { setLoading(false); }
}

async function loadGains(rsn, period) {
  setLoading(true);
  try {
    const gains = await wom.getGains(rsn, period);
    renderGains(gains);
    document.getElementById('gains-content').style.display = '';
    document.getElementById('welcome-msg').style.display   = 'none';
    loadTimeline(rsn, 'overall', period);
  } catch (err) { showError('Could not load gains: ' + err.message); }
  finally { setLoading(false); }
}

// ── Render gains ──────────────────────────────────────────────────────────────
function renderGains(data) {
  const skills = data?.data?.skills;
  if (!skills) {
    document.getElementById('gains-grid').innerHTML = '<div class="no-data">No gains data.</div>';
    return;
  }
  const entries = SKILLS.filter(([id]) => id !== 'overall').map(([id, name, icon, color]) => {
    const g = skills[id] || {};
    return { id, name, icon, color, gained: Number(g.experience?.gained || 0), lvlGained: Number((g.level?.end || 0) - (g.level?.start || 0)) };
  }).filter(e => e.gained > 0).sort((a, b) => b.gained - a.gained);

  if (!entries.length) {
    document.getElementById('gains-grid').innerHTML = '<div class="no-data" style="grid-column:span 3">No XP gains in this period.</div>';
    return;
  }
  document.getElementById('gains-grid').innerHTML = entries.map(e => `
    <div class="gain-card" data-skill="${e.id}" style="border-color:${e.color}33">
      <img class="gain-skill-icon" src="${e.icon}" alt="${e.name}" loading="lazy">
      <div class="gain-skill-name">${e.name.length > 8 ? e.name.slice(0,7) + '…' : e.name}</div>
      <div class="gain-xp">+${fmtXP(e.gained)}</div>
      ${e.lvlGained > 0 ? `<div class="gain-lvl">+${e.lvlGained} lvl</div>` : ''}
    </div>`).join('');

  document.querySelectorAll('.gain-card[data-skill]').forEach(card => {
    card.addEventListener('click', () => {
      document.querySelectorAll('.gain-card').forEach(c => c.style.borderColor = '');
      card.style.borderColor = 'var(--gold)';
      loadTimeline(currentRsn, card.dataset.skill, currentPeriod);
    });
  });
}

async function loadTimeline(rsn, metric, period) {
  try {
    const timeline = await wom.getTimeline(rsn, metric, period);
    renderTimelineChart(timeline, metric);
  } catch {}
}

function renderTimelineChart(timeline, metric) {
  const canvas = document.getElementById('chart-timeline');
  if (!canvas) return;
  if (chartTimeline) { chartTimeline.destroy(); chartTimeline = null; }
  if (!timeline?.length) return;
  const skill  = SKILL_MAP[metric];
  const color  = skill?.color || '#b88848';
  const labels = timeline.map(p => new Date(p.date || p.createdAt).toLocaleDateString('en-GB', { month:'short', day:'numeric' }));
  const values = timeline.map(p => { const d = p.data?.skills?.[metric] || p.data; return d?.experience ?? d?.level ?? 0; });
  chartTimeline = new Chart(canvas, {
    type: 'line',
    data: { labels, datasets: [{ data: values, borderColor: color, backgroundColor: color + '22', borderWidth: 2, pointRadius: 2, fill: true, tension: .4 }] },
    options: { responsive: true, plugins: { legend: { display: false }, title: { display: true, text: `${skill?.name || metric}`, color: '#8b949e', font: { size: 12 } } }, scales: { x: { ticks: { color:'#8b949e', font:{ size:9 }, maxTicksLimit:8 }, grid:{ color:'#21262d' } }, y: { ticks:{ color:'#8b949e' }, grid:{ color:'#21262d' } } } },
  });
}

function renderLevelsChart(data) {
  const canvas = document.getElementById('chart-levels');
  if (!canvas) return;
  if (chartLevels) { chartLevels.destroy(); chartLevels = null; }
  const snap   = data.latestSnapshot?.data?.skills || {};
  const skills = SKILLS.filter(([id]) => id !== 'overall');
  chartLevels = new Chart(canvas, {
    type: 'bar',
    data: { labels: skills.map(([, n]) => n), datasets: [{ data: skills.map(([id]) => Number(snap[id]?.level || 0)), backgroundColor: skills.map(([,,, c]) => c + '66'), borderColor: skills.map(([,,, c]) => c), borderWidth: 1, borderRadius: 3 }] },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { x: { ticks: { color:'#8b949e', font:{ size:8 } }, grid:{ color:'#21262d' } }, y: { min:0, max:99, ticks:{ color:'#8b949e' }, grid:{ color:'#21262d' } } } },
  });
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function setLoading(on) { document.getElementById('loader').classList.toggle('loading', on); }
function clearError() { const el = document.getElementById('error-msg'); el.textContent = ''; el.classList.remove('show'); }
function showError(msg) { const el = document.getElementById('error-msg'); el.textContent = msg; el.classList.add('show'); }

// ── Boot ──────────────────────────────────────────────────────────────────────
const cached = player.getFromCache();
if (cached) {
  currentRsn = cached.displayName || cached.username || '';
  renderLevelsChart(cached);
  if (currentRsn) loadGains(currentRsn, currentPeriod);
} else {
  const lastRsn = storage.get(STORAGE_KEYS.RSN, '');
  if (lastRsn) loadPlayer(lastRsn);
}
</script>
</body>
</html>
