<!DOCTYPE html>
<html lang="en">

  <meta charset="UTF-8">

  <link rel="manifest" href="/manifest.json">

</head>
<body>

<header>
  <h1>OSTS — Bestiary</h1>
  <div class="hdr-actions">
    <button id="install-btn">Install</button>
    <button class="hdr-btn icon-btn" id="settings-btn">⚙️</button>
  </div>
</header>

<div id="settings-overlay"></div>
<div id="settings-panel" aria-hidden="true">
  <div class="settings-head">
    <h2>Settings</h2>
    <button class="settings-close" id="settings-close">✕</button>
  </div>
  <div class="settings-block">
    <div class="settings-label">Appearance</div>
    <div class="theme-options">
      <button class="theme-chip" data-theme="dark">Dark</button>
      <button class="theme-chip" data-theme="light">Light</button>
      <button class="theme-chip" data-theme="brown">Brown</button>
    </div>
  </div>
  </div>
  <div class="settings-block">
    <div class="settings-label">Player Profiles</div>
    <div id="sp-profile-list" style="margin-bottom:8px"></div>
  </div>
</div>

<div id="main">
  <div class="page active" id="page-bestiary">
    <!-- Search / Filter bar -->
    <input id="bestiary-search" class="timer-search" placeholder="Search monster, location, weakness…" style="margin-bottom:10px;width:100%">

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px" id="category-chips">
      <button class="period-tab active" data-cat="All">All</button>
      <button class="period-tab" data-cat="Slayer">🎯 Slayer</button>
      <button class="period-tab" data-cat="Bosses">🏆 Bosses</button>
      <button class="period-tab" data-cat="Demons">😈 Demons</button>
      <button class="period-tab" data-cat="Dragons">🐉 Dragons</button>
      <button class="period-tab" data-cat="Undead">💀 Undead</button>
    </div>

    <div id="loader"></div>

    <div id="bestiary-list">
      <div class="welcome">
        <div class="welcome-icon">🐉</div>
        <p>Bestiary is being rebuilt.<br> Coming soon!!!</p>
      </div>
    </div>
  </div>
</div>

<!-- Bottom Nav -->
<nav id="bottom-nav"></nav>

<!-- More Menu -->
<div class="modal-overlay" id="more-menu-overlay">
  <div class="modal-sheet">
    <div class="modal-head">
      <div><div class="modal-title">More</div></div>
      <button class="modal-close" id="more-menu-close">✕</button>
    </div>
  <div class="modal-actions">
      <a class="modal-action" href="/Pages/More_Pages/bestiary.html">🐉 Bestiary</a>
      <a class="modal-action" href="/Pages/More_Pages/bossing.html">🏆 Bossing</a>
      <a class="modal-action" href="/Pages/More_Pages/fairyRings.html">🍄 Fairy Rings</a>
      <a class="modal-action" href="/Pages/More_Pages/goals.html">📊 Goals</a>
      <a class="modal-action" href="/Pages/More_Pages/petLog.html">🐾 Pet Log</a>
      <a class="modal-action" href="/Pages/More_Pages/quests.html">🗺️ Quests</a>
      <a class="modal-action" href="/Pages/More_Pages/timers.html">⏰ Timers</a>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initPage } from '/JS/shared.js';
initPage('bestiary');

// Bestiary full implementation — coming next.
// Will pull monster stats from OSRS Wiki Cargo API,
// with Anthropic API fallback (same pattern as original OSTS bestiary).


// ── Player Profiles ───────────────────────────────────────────────────────────
const PROFILES_KEY_SP    = 'osts_profiles_v2';
const ACTIVE_PROF_KEY_SP = 'osts_active_profile_v2';
const SP_ICONS  = { ironman:'🛡', hardcore:'💀', ultimate:'🔱', regular:'⚔', gim:'👥', ghcim:'☠', ugim:'👥' };
const SP_LABELS = { ironman:'Iron', hardcore:'HCIM', ultimate:'UIM', regular:'Regular', gim:'GIM', ghcim:'GHCIM', ugim:'UGIM' };

function spGetProfiles() { return storage.get(PROFILES_KEY_SP, []); }
function spGetActiveId()  { return storage.get(ACTIVE_PROF_KEY_SP, null); }
function spSetActiveId(id){ storage.set(ACTIVE_PROF_KEY_SP, id); }
function spNorm(t){ return normalizeAccountType(t); }

function renderSpProfiles() {
  const list = document.getElementById('sp-profile-list');
  if (!list) return;
  const profiles = spGetProfiles();
  const activeId = spGetActiveId();
  if (!profiles.length) {
    list.innerHTML = '<div style="font-size:12px;color:var(--muted)">No saved profiles.<br>Search a player on <a href="overview.html" style="color:var(--gold)">Overview</a> to create one.</div>';
    return;
  }
  const sorted = [...profiles].sort((a,b) => (b.id === activeId) - (a.id === activeId));
  list.innerHTML = sorted.map(p => `
    <div class="sp-profile-card${p.id === activeId ? ' active' : ''}">
      <div class="sp-avatar">${SP_ICONS[spNorm(p.type)] || '⚔'}</div>
      <div class="sp-info">
        <div class="sp-nickname">${p.nickname}</div>
        <div class="sp-rsn-type">${p.rsn} · ${SP_LABELS[spNorm(p.type)] || 'Iron'}</div>
      </div>
      ${p.id !== activeId ? `<button class="sp-btn" data-sp-load="${p.id}">Load</button>` : '<span style="font-size:10px;color:var(--gold)">Active</span>'}
    </div>`).join('');

  list.querySelectorAll('[data-sp-load]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = spGetProfiles().find(x => x.id === btn.dataset.spLoad);
      if (!p) return;
      spSetActiveId(p.id);
      storage.set(STORAGE_KEYS.ACCOUNT_TYPE, spNorm(p.type));
      storage.set(STORAGE_KEYS.RSN, p.rsn);
      settings.close();
      showToast('Switched to ' + p.nickname);
    });
  });
}

document.getElementById('settings-btn')?.addEventListener('click', renderSpProfiles, true);

</script>
</body>
</html>
