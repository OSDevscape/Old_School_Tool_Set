<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2b241b">
  <link rel="manifest" href="/manifest.json">
  <title>OSTS — Clue Scroll Solver</title>
  <link rel="stylesheet" href="/style.css">
  <style>

    :root {
      --beginner: #f0f0f0;
      --easy:   #3fb950;
      --medium: #58a6ff;
      --hard:   #f0883e;
      --elite:  #b388ff;
      --master: #ffd700;
    }

    .cs-search-wrap { display:flex; gap:8px; margin-bottom:10px; }
    .cs-search {
      flex:1; background:var(--surface2); border:1px solid var(--border);
      border-radius:10px; color:var(--text); font-size:14px;
      padding:9px 12px; outline:none; transition:border-color .15s;
    }
    .cs-search:focus { border-color:var(--gold); }
    .cs-search::placeholder { color:var(--muted); }

    .cs-filters { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:6px; scrollbar-width:none; }
    .cs-filters::-webkit-scrollbar { display:none; }
    .cs-filter {
      flex-shrink:0; padding:5px 12px; border-radius:999px;
      font-size:11px; font-weight:700; border:1px solid var(--border);
      background:var(--surface2); color:var(--muted); cursor:pointer;
      transition:all .15s; white-space:nowrap;
    }
    .cs-filter.active                 { background:var(--gold);   color:#000; border-color:var(--gold); }
    .cs-filter[data-tier="beginner"].active { background:var(--beginner); border-color:var(--beginner); color:#111; }
    .cs-filter[data-tier="easy"].active   { background:var(--easy);   border-color:var(--easy);   color:#000; }
    .cs-filter[data-tier="medium"].active { background:var(--medium); border-color:var(--medium); color:#000; }
    .cs-filter[data-tier="hard"].active   { background:var(--hard);   border-color:var(--hard);   color:#000; }
    .cs-filter[data-tier="elite"].active  { background:var(--elite);  border-color:var(--elite);  color:#000; }
    .cs-filter[data-tier="master"].active { background:var(--master); border-color:var(--master); color:#000; }

    .cs-type-filters { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; scrollbar-width:none; }
    .cs-type-filters::-webkit-scrollbar { display:none; }

    .cs-count { font-size:11px; color:var(--muted); margin-bottom:8px; text-align:right; }
    .cs-list  { display:flex; flex-direction:column; gap:8px; }

    /* ── Base card ── */
    .cs-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:13px; overflow:hidden; cursor:pointer;
      transition:border-color .15s;
    }
    .cs-card:active { border-color:var(--gold); }
    .cs-card.open   { border-color:var(--gold); }

    .cs-card-top {
      display:flex; align-items:flex-start; gap:10px;
      padding:11px 12px 10px 16px; position:relative;
    }
    .cs-card-top::before {
      content:''; position:absolute; top:0; left:0; bottom:0; width:4px;
      background:var(--tier-col, var(--gold)); border-radius:13px 0 0 13px;
    }

    .cs-badges { display:flex; gap:4px; flex-shrink:0; margin-top:2px; flex-direction:column; }
    .cs-tier-badge {
      font-size:9px; font-weight:800; padding:2px 7px; border-radius:999px;
      background:rgba(0,0,0,.3); color:var(--tier-col,var(--gold));
      border:1px solid var(--tier-col,var(--gold));
      text-transform:uppercase; letter-spacing:.5px; white-space:nowrap;
    }
    .cs-type-badge {
      font-size:9px; font-weight:700; padding:2px 7px; border-radius:999px;
      background:var(--surface2); color:var(--muted);
      border:1px solid var(--border); text-transform:uppercase;
      letter-spacing:.4px; white-space:nowrap;
    }

    .cs-card-main { flex:1; min-width:0; }
    .cs-clue-text { font-size:13px; font-weight:600; color:var(--text); line-height:1.4; margin-bottom:4px; font-style:italic; }
    .cs-solution  { font-size:12px; color:var(--gold); font-weight:700; }
    .cs-location  { font-size:11px; color:var(--muted); margin-top:2px; }

    .cs-chevron { font-size:14px; color:var(--muted); flex-shrink:0; transition:transform .2s; margin-top:2px; user-select:none; }
    .cs-card.open .cs-chevron { transform:rotate(180deg); }

    .cs-detail { display:none; border-top:1px solid var(--border); padding:12px 14px 13px 16px; }
    .cs-card.open .cs-detail { display:block; }

    .cs-detail-row { display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; font-size:12px; }
    .cs-detail-row:last-child { margin-bottom:0; }
    .cs-detail-label { color:var(--muted); font-weight:600; white-space:nowrap; min-width:60px; font-size:11px; }
    .cs-detail-val   { color:var(--text); line-height:1.5; flex:1; }

    .cs-items-list { display:flex; gap:5px; flex-wrap:wrap; margin-top:4px; }
    .cs-item-chip {
      font-size:10px; font-weight:600; padding:3px 9px; border-radius:999px;
      background:rgba(184,136,72,.12); border:1px solid var(--gold);
      color:var(--gold); white-space:nowrap;
    }

    .cs-card-actions { display:flex; gap:6px; margin-top:10px; }
    .cs-act-btn {
      flex:1; padding:8px 0; border-radius:8px; font-size:11px; font-weight:700;
      border:1px solid var(--border); background:var(--surface2);
      color:var(--muted); cursor:pointer; transition:all .15s;
    }
    .cs-act-btn:hover      { border-color:var(--gold); color:var(--gold); }
    .cs-act-btn.primary    { background:var(--gold); color:#000; border-color:var(--gold); }
    .cs-act-btn.bookmarked { background:rgba(184,136,72,.15); color:var(--gold); border-color:var(--gold); }

    /* ─────────────────────────────────────────
       PUZZLE BOX STYLES
    ───────────────────────────────────────── */
    .puzzle-card .cs-card-top { align-items:stretch; }

    /* Thumbnail */
    .puzzle-thumb {
      flex-shrink:0; width:76px; height:76px;
      border-radius:9px; overflow:hidden;
      background:var(--surface2); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
    }
    .puzzle-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
    .puzzle-thumb-fb { font-size:30px; }

    .puzzle-tiers { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }

    /* Solved image (expanded) */
    .puzzle-solved-img {
      width:100%; border-radius:10px; border:1px solid var(--border);
      display:block; margin-bottom:5px;
    }
    .puzzle-img-caption { font-size:10px; color:var(--muted); text-align:center; margin-bottom:12px; }

    /* 6-section guide */
    .puzzle-guide {
      background:var(--surface2); border:1px solid var(--border);
      border-radius:10px; overflow:hidden; margin-top:10px;
    }
    .puzzle-guide-hdr {
      font-size:11px; font-weight:800; color:var(--muted);
      text-transform:uppercase; letter-spacing:.6px;
      padding:8px 12px; border-bottom:1px solid var(--border);
    }

    /* Section colour grid — 5 cols, 5 rows */
    .psg-wrap { padding:10px 12px 4px; }
    .psg-label { font-size:10px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
    .psg-grid  { display:grid; grid-template-columns:repeat(5,1fr); gap:3px; }
    .psg-cell  {
      aspect-ratio:1; border-radius:5px;
      display:flex; align-items:center; justify-content:center;
      font-size:9px; font-weight:800; color:rgba(0,0,0,.75);
    }

    /* Steps */
    .puzzle-steps { padding:6px 12px 8px; }
    .puzzle-step  {
      display:flex; align-items:flex-start; gap:8px;
      padding:6px 0; border-bottom:1px solid rgba(255,255,255,.05);
      font-size:12px;
    }
    .puzzle-step:last-child { border-bottom:none; }
    .puzzle-step-num {
      flex-shrink:0; width:20px; height:20px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:10px; font-weight:800; color:#000; margin-top:1px;
    }
    .s-red    { background:#e74c3c; }
    .s-orange { background:#f0883e; }
    .s-yellow { background:#f1c40f; }
    .s-green  { background:#3fb950; }
    .s-blue   { background:#58a6ff; }
    .s-purple { background:#c084fc; }

    .puzzle-step-text { flex:1; color:var(--text); line-height:1.5; }

    .puzzle-warn {
      margin:4px 12px 12px;
      background:rgba(241,196,15,.07); border:1px solid rgba(241,196,15,.2);
      border-radius:8px; padding:9px 11px;
      font-size:11px; color:var(--text); line-height:1.6;
    }
    .puzzle-warn strong { color:#f1c40f; }

    /* ── Tracker banner ── */
    .cs-tracker {
      background:var(--surface); border:1px solid var(--border);
      border-radius:13px; padding:12px 14px; margin-bottom:12px;
      display:flex; align-items:center; gap:10px;
    }
    .cs-tracker-icon { font-size:22px; flex-shrink:0; }
    .cs-tracker-info { flex:1; min-width:0; }
    .cs-tracker-label { font-size:10px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:2px; }
    .cs-tracker-step  { font-size:13px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cs-tracker-clear { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:4px; }
    .cs-tracker-clear:hover { color:var(--red); }

    /* ── Empty ── */
    .cs-empty { text-align:center; padding:48px 20px; color:var(--muted); font-size:13px; }
    .cs-empty-icon { font-size:36px; margin-bottom:10px; }

  </style>
</head>
<body>

<script type="module">
import { initPage, showToast, settings } from '/JS/shared.js';

// ─── Meta ─────────────────────────────────────────────────────────────────────
const TIER_COL  = { beginner:'#e0e0e0', easy:'#3fb950', medium:'#58a6ff', hard:'#f0883e', elite:'#b388ff', master:'#ffd700' };
const TIER_ICON = { beginner:'⬜', easy:'🟢', medium:'🔵', hard:'🟠', elite:'🟣', master:'⭐' };
const TYPE_ICON = { anagram:'🔤', cipher:'🔒', cryptic:'🗺️', coordinate:'📍', emote:'💃', map:'🗺', puzzle:'🧩', 'hot-cold':'🌡️', challenge:'❓', 'light-box':'💡' };

// ─── 6-section puzzle method ──────────────────────────────────────────────────
// 5×5 grid — colour per cell [row][col]
const GRID_COLORS = [
  ['#e74c3c','#e74c3c','#e74c3c','#e74c3c','#e74c3c'], // row 0 — red
  ['#f0883e','#f0883e','#f0883e','#f0883e','#f0883e'], // row 1 — orange
  ['#f1c40f','#f1c40f','#f1c40f','#f1c40f','#f1c40f'], // row 2 — yellow
  ['#3fb950','#3fb950','#58a6ff','#58a6ff','#c084fc'], // row 3 — green | blue | purple
  ['#3fb950','#3fb950','#58a6ff','#58a6ff','#c084fc'], // row 4 — green | blue | purple
];

const SOLVE_STEPS = [
  { cls:'s-red',    n:'1', text:'Arrange the <strong>top row</strong> (red section) left-to-right to match the solved image.' },
  { cls:'s-orange', n:'2', text:'Arrange the <strong>2nd row</strong> (orange section) left-to-right. Do not touch row 1.' },
  { cls:'s-yellow', n:'3', text:'Arrange the <strong>3rd row</strong> (yellow section) left-to-right. Do not touch rows 1–2.' },
  { cls:'s-green',  n:'4', text:'Place the two <strong>left column</strong> tiles in rows 4–5 (green section) correctly.' },
  { cls:'s-blue',   n:'5', text:'Place the two <strong>middle column</strong> tiles in rows 4–5 (blue section) correctly.' },
  { cls:'s-purple', n:'6', text:'Arrange the remaining <strong>bottom-right 2×2</strong> + final two tiles (purple section) to finish.' },
];

function puzzleGuideHtml() {
  const gridHtml = GRID_COLORS.flatMap(row =>
    row.map(c => `<div class="psg-cell" style="background:${c}"></div>`)
  ).join('');

  const stepsHtml = SOLVE_STEPS.map(s => `
    <div class="puzzle-step">
      <div class="puzzle-step-num ${s.cls}">${s.n}</div>
      <div class="puzzle-step-text">${s.text}</div>
    </div>`).join('');

  return `
  <div class="puzzle-guide">
    <div class="puzzle-guide-hdr">🧩 How to Solve — 6-Section Method</div>
    <div class="psg-wrap">
      <div class="psg-label">Section colour map (5 × 5 grid)</div>
      <div class="psg-grid">${gridHtml}</div>
    </div>
    <div class="puzzle-steps">${stepsHtml}</div>
    <div class="puzzle-warn">
      <strong>⚠️ Golden rule:</strong> Once a section is complete, <strong>never move those tiles again</strong>.
      Work strictly from top to bottom. If a tile slips out of a finished row, restart that section.<br><br>
      <strong>💡 Tip:</strong> If you got a puzzle you've already seen, destroy it and ask the NPC again — or log out to reset the scramble.
    </div>
  </div>`;
}

// ─── Puzzle Box data ──────────────────────────────────────────────────────────
// 7 puzzles — 3 available hard/elite/master, 4 master-only
const PUZZLES = [
  { id:'pz-castle',   name:'Castle',           tiers:['hard','elite','master'], img:'https://oldschool.runescape.wiki/images/Castle_puzzle_solved.png?98edb',                       notes:'The most common puzzle. Depicts Falador castle. Scrambled 101 times before being given to you.' },
  { id:'pz-troll',    name:'Troll',             tiers:['hard','elite','master'], img:'https://oldschool.runescape.wiki/images/Troll_puzzle_solved.png?4996c',                        notes:'Features a troll from the Troll Stronghold region.' },
  { id:'pz-tree',     name:'Tree',              tiers:['hard','elite','master'], img:'https://oldschool.runescape.wiki/images/Tree_puzzle_solved.png?c4267',                         notes:'A tree landscape. Available from hard clues onwards.' },
  { id:'pz-gnome',    name:'Gnome Child',       tiers:['master'],               img:'https://oldschool.runescape.wiki/images/Gnome_child_puzzle_solved.png?4b269',                  notes:'Master clue only. Beloved by the community — the iconic Gnome Child stares into your soul.' },
  { id:'pz-cerberus', name:'Cerberus',          tiers:['master'],               img:'https://oldschool.runescape.wiki/images/Cerberus_puzzle_solved.png?527ba',                     notes:'Master clue only. Cerberus, guardian of the Slayer dungeon.' },
  { id:'pz-zulrah',   name:'Zulrah',            tiers:['master'],               img:'https://oldschool.runescape.wiki/images/Zulrah_puzzle_solved.png?58d9d',                       notes:'Master clue only. The snake boss Zulrah.' },
  { id:'pz-tob',      name:'Theatre of Blood',  tiers:['master'],               img:'https://oldschool.runescape.wiki/images/Theatre_of_Blood_puzzle_solved.png?27f0d',             notes:'Master clue only. The Theatre of Blood raid scene.' },
];

// ─── Clue Data ───────────────────────────────────────────────────────────────
// Types per tier (OSRS wiki):
//   Beginner : anagram, cryptic, emote, hot-cold, map
//   Easy     : cryptic, emote, map   (no anagrams, no coordinates)
//   Medium   : anagram, challenge, cipher, coordinate, cryptic, emote
//   Hard     : anagram, challenge, cipher, coordinate, cryptic, emote, map, puzzle
//   Elite    : anagram, challenge, coordinate, cryptic, emote, map, puzzle
//   Master   : anagram, coordinate, cryptic, emote, hot-cold, light-box, puzzle
const CLUES = [
  { id:"b1", tier:"beginner", type:"anagram", clue:"AN EARL", solution:"Ranael", location:"Al Kharid \u2014 skirt shop", items:[], answer:null, notes:"Talk to Ranael in the platelegs/plateskirt shop in Al Kharid." },
  { id:"b2", tier:"beginner", type:"anagram", clue:"CHAR GAME DISORDER", solution:"Archmage Sedridor", location:"Wizards' Tower \u2014 basement", items:[], answer:null, notes:"Talk to Archmage Sedridor in the basement of the Wizards' Tower." },
  { id:"b3", tier:"beginner", type:"anagram", clue:"CARPET AHOY", solution:"Apothecary", location:"South-west Varrock", items:[], answer:null, notes:"The Apothecary is in the south-west corner of Varrock." },

  { id:"b7", tier:"beginner", type:"anagram", clue:"RUG DETER", solution:"Gertrude", location:"West of Varrock, south of the Cooks' Guild", items:[], answer:null, notes:"Gertrude is found west of Varrock near her house." },
  { id:"b8", tier:"beginner", type:"anagram", clue:"SIR SHARE RED", solution:"Hairdresser", location:"Western Falador", items:[], answer:null, notes:"The hairdresser is in the salon in western Falador." },
  { id:"b9", tier:"beginner", type:"anagram", clue:"TAUNT ROOF", solution:"Fortunato", location:"Draynor Village Market", items:[], answer:null, notes:"Fortunato is the wine stall merchant in Draynor Village Market." },

// ─── State ─────────────────────────────────────────────────────────────────────
const BOOK_KEY  = 'osts_clue_bookmarks_v2';
const STEP_KEY  = 'osts_clue_current_step_v2';
let activeTier  = 'all';
let activeType  = 'all';
let searchQ     = '';
let bookmarks   = new Set(JSON.parse(localStorage.getItem(BOOK_KEY) || '[]'));
let currentStep = localStorage.getItem(STEP_KEY) || null;

// ─── Puzzle card HTML ──────────────────────────────────────────────────────────
function puzzleCardHtml(pz) {
  const isBookmarked = bookmarks.has(pz.id);
  const tierBadges   = pz.tiers.map(t =>
    `<span class="cs-tier-badge" style="color:${TIER_COL[t]};border-color:${TIER_COL[t]}">${TIER_ICON[t]} ${t}</span>`
  ).join('');

  return `
  <div class="cs-card puzzle-card" data-id="${pz.id}" style="--tier-col:#c084fc">
    <div class="cs-card-top">
      <div class="puzzle-thumb">
        <img src="${pz.img}" alt="${pz.name} solved" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span class="puzzle-thumb-fb" style="display:none">🧩</span>
      </div>
      <div class="cs-card-main">
        <div class="cs-clue-text" style="font-style:normal;font-weight:800;font-size:14px">${pz.name}</div>
        <div class="cs-solution">🧩 Slide Puzzle Box</div>
        <div class="puzzle-tiers">${tierBadges}</div>
      </div>
      <div class="cs-chevron">▾</div>
    </div>
    <div class="cs-detail">

      <!-- Solved image -->
      <div style="text-align:center;margin-bottom:4px">
        <img src="${pz.img}" alt="${pz.name} solved" loading="lazy" class="puzzle-solved-img"
             onerror="this.style.display='none'">
      </div>
      <div class="puzzle-img-caption">↑ Solved state — this is your target</div>

      <!-- Notes -->
      <div class="cs-detail-row">
        <div class="cs-detail-label">Notes</div>
        <div class="cs-detail-val">${pz.notes}</div>
      </div>

      <!-- Solving guide -->
      ${puzzleGuideHtml()}

      <div class="cs-card-actions" style="margin-top:10px">
        <button class="cs-act-btn${isBookmarked ? ' bookmarked' : ''}" data-action="bookmark" data-id="${pz.id}">
          ${isBookmarked ? '🔖 Saved' : '🔖 Save'}
        </button>
        <button class="cs-act-btn" data-action="wiki" data-id="${pz.id}">
          📖 Full Guide
        </button>
      </div>
    </div>
  </div>`;
}

// ─── Regular clue card HTML ────────────────────────────────────────────────────
function clueCardHtml(c) {
  const col         = TIER_COL[c.tier] || '#b88848';
  const isBookmarked= bookmarks.has(c.id);
  const isCurrent   = currentStep === c.id;
  const itemsHtml   = c.items.length
    ? `<div class="cs-items-list">${c.items.map(i=>`<span class="cs-item-chip">${h(i)}</span>`).join('')}</div>`
    : `<span style="color:var(--muted)">None required</span>`;
  return `
  <div class="cs-card${isCurrent?' open':''}" data-id="${c.id}" style="--tier-col:${col}">
    <div class="cs-card-top">
      <div class="cs-badges">
        <span class="cs-tier-badge">${TIER_ICON[c.tier]} ${c.tier}</span>
        <span class="cs-type-badge">${TYPE_ICON[c.type]||''} ${c.type}</span>
      </div>
      <div class="cs-card-main">
        <div class="cs-clue-text">${h(c.clue)}</div>
        <div class="cs-solution">→ ${h(c.solution||'(decode required)')}</div>
        ${c.location?`<div class="cs-location">📍 ${h(c.location)}</div>`:''}
      </div>
      <div class="cs-chevron">▾</div>
    </div>
    <div class="cs-detail">
      ${c.location?`<div class="cs-detail-row"><div class="cs-detail-label">Location</div><div class="cs-detail-val">${h(c.location)}</div></div>`:''}
      <div class="cs-detail-row"><div class="cs-detail-label">Items</div><div class="cs-detail-val">${itemsHtml}</div></div>
      ${c.notes?`<div class="cs-detail-row"><div class="cs-detail-label">Tips</div><div class="cs-detail-val">${h(c.notes)}</div></div>`:''}
      ${c.answer?`<div class="cs-answer-box"><div class="cs-answer-label">Challenge Answer</div>${h(c.answer)}</div>`:''}
      <div class="cs-card-actions">
        <button class="cs-act-btn${isBookmarked?' bookmarked':''}" data-action="bookmark" data-id="${c.id}">${isBookmarked?'🔖 Saved':'🔖 Save'}</button>
        <button class="cs-act-btn${isCurrent?' primary':''}" data-action="track" data-id="${c.id}">${isCurrent?'📌 Tracking':'📌 Track'}</button>
        <button class="cs-act-btn" data-action="wiki" data-id="${c.id}">📖 Wiki</button>
      </div>
    </div>
  </div>`;
}

// ─── Filter ────────────────────────────────────────────────────────────────────
function filterAll() {
  const res = [];
  // Puzzle boxes: show only when "All Tiers" OR explicitly filtering "Puzzle" type
  // Never bleed into a specific tier filter — they have their own Puzzle chip
  const showPuzzle = activeType === 'puzzle' || (activeType === 'all' && activeTier === 'all');
  const showOther  = activeType === 'all' || activeType !== 'puzzle';
  const q = searchQ.toLowerCase();

  if (showPuzzle) {
    PUZZLES.forEach(pz => {
      if (activeTier !== 'all' && !pz.tiers.includes(activeTier)) return;
      if (q && !pz.name.toLowerCase().includes(q) && !'puzzle box slide'.includes(q) && !pz.notes.toLowerCase().includes(q)) return;
      res.push({ _pz: true, pz });
    });
  }
  if (showOther) {
    CLUES.forEach(c => {
      if (activeType !== 'all' && c.type !== activeType) return;
      if (activeTier !== 'all' && c.tier !== activeTier) return;
      if (q && !c.clue.toLowerCase().includes(q) && !c.solution.toLowerCase().includes(q)
             && !c.location.toLowerCase().includes(q) && !(c.notes||'').toLowerCase().includes(q)) return;
      res.push({ _pz: false, c });
    });
  }
  return res;
}

// ─── Render ────────────────────────────────────────────────────────────────────
function renderList() {
  const list  = document.getElementById('cs-list');
  const count = document.getElementById('cs-count');
  const items = filterAll();
  count.textContent = `${items.length} result${items.length!==1?'s':''}`;

  if (!items.length) {
    list.innerHTML = `<div class="cs-empty"><div class="cs-empty-icon">🔍</div>No results.<br>Try different keywords or filters.</div>`;
    return;
  }

  list.innerHTML = items.map(it => it._pz ? puzzleCardHtml(it.pz) : clueCardHtml(it.c)).join('');

  list.querySelectorAll('.cs-card').forEach(card => {
    card.querySelector('.cs-card-top').addEventListener('click', () => card.classList.toggle('open'));
    card.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const { action, id } = btn.dataset;
        if (action === 'bookmark') {
          bookmarks.has(id) ? (bookmarks.delete(id), showToast('Bookmark removed')) : (bookmarks.add(id), showToast('Bookmarked! 🔖'));
          localStorage.setItem(BOOK_KEY, JSON.stringify([...bookmarks]));
          renderList();
        }
        if (action === 'track') {
          currentStep = currentStep === id ? null : id;
          currentStep ? localStorage.setItem(STEP_KEY, id) : localStorage.removeItem(STEP_KEY);
          showToast(currentStep ? 'Step pinned 📌' : 'Step cleared');
          renderTracker(); renderList();
        }
        if (action === 'wiki') {
          const pz = PUZZLES.find(p => p.id === id);
          const q  = pz ? 'Puzzle_box' : ('clue scroll ' + (CLUES.find(c=>c.id===id)?.solution||''));
          window.open(`https://oldschool.runescape.wiki/w/${encodeURIComponent(pz ? q : 'Special:Search?search='+q)}`, '_blank');
        }
      });
    });
  });
}

function renderTracker() {
  const el = document.getElementById('cs-tracker');
  const tx = document.getElementById('cs-tracker-text');
  if (!currentStep) { el.style.display='none'; return; }
  const c = CLUES.find(c=>c.id===currentStep);
  if (!c)            { el.style.display='none'; return; }
  el.style.display='flex'; tx.textContent=c.clue;
}

// ─── Bind filters ──────────────────────────────────────────────────────────────
function bindFilters() {
  document.getElementById('cs-tier-filters').addEventListener('click', e => {
    const b = e.target.closest('.cs-filter'); if (!b) return;
    activeTier = b.dataset.tier;
    document.querySelectorAll('#cs-tier-filters .cs-filter').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); renderList();
  });
  document.getElementById('cs-type-filters').addEventListener('click', e => {
    const b = e.target.closest('.cs-filter'); if (!b) return;
    activeType = b.dataset.type;
    document.querySelectorAll('#cs-type-filters .cs-filter').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); renderList();
  });
  let t;
  document.getElementById('cs-search').addEventListener('input', e => {
    clearTimeout(t); t = setTimeout(()=>{ searchQ=e.target.value.trim(); renderList(); }, 180);
  });
}

// ─── Misc ─────────────────────────────────────────────────────────────────────
document.getElementById('cs-tracker-clear').addEventListener('click',()=>{
  currentStep=null; localStorage.removeItem(STEP_KEY); renderTracker(); renderList(); showToast('Step cleared');
});
document.getElementById('clear-bookmarks-btn').addEventListener('click',()=>{
  bookmarks.clear(); localStorage.removeItem(BOOK_KEY); renderList(); showToast('Bookmarks cleared');
});

const h = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ─── Init ─────────────────────────────────────────────────────────────────────
initPage({ activePage: 'more' });
bindFilters();
renderTracker();
renderList();

document.getElementById('settings-btn').addEventListener('click', ()=>settings.open());
document.getElementById('settings-close').addEventListener('click', ()=>settings.close());
document.getElementById('settings-overlay').addEventListener('click', ()=>settings.close());
document.querySelectorAll('.theme-chip').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const theme=btn.dataset.theme;
    document.body.className=theme==='dark'?'':`theme-${theme}`;
    localStorage.setItem('osts_theme_v2',theme);
  });
});
</script>
