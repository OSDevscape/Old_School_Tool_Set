<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2b241b">
  <link rel="manifest" href="/manifest.json">
  <title>OSTS — Collection Log</title>
  <link rel="stylesheet" href="/style.css">
  <style>

    /* ── Progress banner ── */
    .cl-banner {
      background:var(--surface); border:1px solid var(--border);
      border-radius:14px; padding:14px 15px; margin-bottom:12px;
    }
    .cl-banner-top {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:10px;
    }
    .cl-banner-label { font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
    .cl-rank {
      display:flex; align-items:center; gap:6px;
      font-size:12px; font-weight:700; color:var(--gold);
    }
    .cl-rank-badge {
      background:var(--gold); color:#000;
      font-size:10px; font-weight:800; padding:2px 8px;
      border-radius:999px; letter-spacing:.4px;
    }
    .cl-next-rank { font-size:10px; color:var(--muted); margin-top:2px; }

    .cl-total-count {
      font-size:28px; font-weight:800; color:var(--text);
      letter-spacing:-1px; line-height:1;
    }
    .cl-total-sub { font-size:11px; color:var(--muted); margin-top:2px; }

    .cl-progress-bar {
      height:8px; background:var(--surface2); border-radius:999px; overflow:hidden;
    }
    .cl-progress-fill {
      height:100%; background:linear-gradient(90deg,var(--gold),#e8a030);
      border-radius:999px; transition:width .4s ease;
    }

    /* ── Category stat chips ── */
    .cl-cat-stats {
      display:flex; gap:6px; overflow-x:auto; margin-top:10px;
      scrollbar-width:none; padding-bottom:2px;
    }
    .cl-cat-stats::-webkit-scrollbar { display:none; }
    .cl-cat-stat {
      flex-shrink:0; background:var(--surface2); border:1px solid var(--border);
      border-radius:10px; padding:6px 10px; text-align:center; min-width:72px;
      cursor:pointer; transition:border-color .15s;
    }
    .cl-cat-stat:hover { border-color:var(--gold); }
    .cl-cat-stat.active { border-color:var(--gold); background:rgba(184,136,72,.1); }
    .cl-cat-stat-icon { font-size:16px; line-height:1; margin-bottom:2px; }
    .cl-cat-stat-pct  { font-size:13px; font-weight:800; color:var(--text); }
    .cl-cat-stat-name { font-size:9px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
    .cl-cat-mini-bar  { height:3px; background:var(--border); border-radius:999px; margin-top:4px; overflow:hidden; }
    .cl-cat-mini-fill { height:100%; background:var(--gold); border-radius:999px; }

    /* ── Search ── */
    .cl-search {
      width:100%; background:var(--surface2); border:1px solid var(--border);
      border-radius:10px; color:var(--text); font-size:14px;
      padding:9px 12px; outline:none; margin-bottom:10px;
      transition:border-color .15s; box-sizing:border-box;
    }
    .cl-search:focus { border-color:var(--gold); }
    .cl-search::placeholder { color:var(--muted); }

    /* ── Filter row ── */
    .cl-filters {
      display:flex; gap:6px; overflow-x:auto; margin-bottom:10px;
      scrollbar-width:none; padding-bottom:2px;
    }
    .cl-filters::-webkit-scrollbar { display:none; }
    .cl-filter {
      flex-shrink:0; padding:5px 13px; border-radius:999px; border:1px solid var(--border);
      background:var(--surface2); color:var(--muted); font-size:11px; font-weight:700;
      cursor:pointer; white-space:nowrap; transition:all .15s;
    }
    .cl-filter.active { background:var(--gold); color:#000; border-color:var(--gold); }

    /* ── Result count / sort ── */
    .cl-toolbar {
      display:flex; align-items:center; justify-content:space-between;
      font-size:11px; color:var(--muted); margin-bottom:8px;
    }
    .cl-sort-btn {
      background:var(--surface2); border:1px solid var(--border); border-radius:8px;
      padding:4px 10px; font-size:10px; font-weight:700; color:var(--muted);
      cursor:pointer; transition:all .15s;
    }
    .cl-sort-btn:hover { border-color:var(--gold); color:var(--gold); }

    /* ── Entry cards ── */
    .cl-list { display:flex; flex-direction:column; gap:7px; }

    .cl-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:13px; overflow:hidden; transition:border-color .15s;
    }
    .cl-card.open   { border-color:var(--gold); }
    .cl-card.done   { border-color:rgba(63,185,80,.35); }

    .cl-card-top {
      display:flex; align-items:center; gap:10px;
      padding:10px 12px 10px 15px; cursor:pointer;
      position:relative;
    }
    .cl-card-top::before {
      content:''; position:absolute; top:0; left:0; bottom:0; width:4px;
      background:var(--entry-col, var(--border));
      border-radius:13px 0 0 13px;
    }

    .cl-entry-icon {
      font-size:20px; flex-shrink:0; width:36px; height:36px;
      display:flex; align-items:center; justify-content:center;
      background:var(--surface2); border-radius:9px;
    }
    .cl-entry-info { flex:1; min-width:0; }
    .cl-entry-name {
      font-size:13px; font-weight:700; color:var(--text);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      margin-bottom:3px;
    }

    .cl-entry-bar-wrap { display:flex; align-items:center; gap:7px; }
    .cl-entry-bar {
      flex:1; height:5px; background:var(--surface2);
      border-radius:999px; overflow:hidden;
    }
    .cl-entry-fill {
      height:100%; border-radius:999px;
      background:linear-gradient(90deg,var(--gold),#e8a030);
      transition:width .3s;
    }
    .cl-entry-fill.complete { background:linear-gradient(90deg,#3fb950,#27ae60); }
    .cl-entry-count {
      font-size:10px; font-weight:700; color:var(--muted);
      flex-shrink:0; white-space:nowrap;
    }
    .cl-entry-count.complete { color:#3fb950; }

    .cl-chevron {
      font-size:13px; color:var(--muted); flex-shrink:0;
      transition:transform .2s;
    }
    .cl-card.open .cl-chevron { transform:rotate(180deg); }

    /* ── Item grid ── */
    .cl-items {
      display:none; border-top:1px solid var(--border);
      padding:10px 12px 12px;
      display:none; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
      gap:5px;
    }
    .cl-card.open .cl-items { display:grid; }

    .cl-item {
      display:flex; align-items:center; gap:7px;
      padding:7px 9px; border-radius:9px; cursor:pointer;
      border:1px solid var(--border); background:var(--surface2);
      transition:all .15s; user-select:none;
    }
    .cl-item:active { transform:scale(.96); }
    .cl-item.got {
      background:rgba(63,185,80,.1);
      border-color:rgba(63,185,80,.4);
    }
    /* Official wiki item sprite */
    .cl-item-img {
      width:24px; height:24px; object-fit:contain; flex-shrink:0;
      image-rendering:pixelated; /* keeps OSRS sprites crisp */
    }
    .cl-item.got .cl-item-img { opacity:.7; }
    .cl-item-check {
      width:16px; height:16px; border-radius:4px; flex-shrink:0;
      border:2px solid var(--border); display:flex; align-items:center;
      justify-content:center; font-size:10px; transition:all .12s;
    }
    .cl-item.got .cl-item-check {
      background:#3fb950; border-color:#3fb950; color:#000;
    }
    .cl-item-name {
      font-size:11px; font-weight:600; color:var(--text);
      line-height:1.3; flex:1;
    }
    .cl-item.got .cl-item-name { color:rgba(63,185,80,.9); }

    /* ── Action bar inside card ── */
    .cl-card-actions {
      display:flex; gap:6px; padding:0 12px 10px;
    }
    .cl-card.open .cl-card-actions { display:flex; }
    .cl-card-actions { display:none; }
    .cl-act-btn {
      flex:1; padding:7px 0; border-radius:8px; font-size:11px; font-weight:700;
      border:1px solid var(--border); background:var(--surface2);
      color:var(--muted); cursor:pointer; transition:all .15s;
    }
    .cl-act-btn:hover { border-color:var(--gold); color:var(--gold); }
    .cl-act-btn.danger:hover { border-color:var(--red); color:var(--red); }

    /* ── Empty state ── */
    .cl-empty {
      text-align:center; padding:48px 20px;
      color:var(--muted); font-size:13px; line-height:1.8;
    }
    .cl-empty-icon { font-size:36px; margin-bottom:12px; }

    /* ── Rank milestone toast ── */
    .cl-rank-milestone {
      display:none; position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
      background:var(--gold); color:#000; font-size:13px; font-weight:800;
      padding:10px 20px; border-radius:999px; z-index:999;
      box-shadow:0 4px 20px rgba(0,0,0,.4); white-space:nowrap;
      animation: fadeUp .4s ease;
    }
    @keyframes fadeUp {
      from { opacity:0; transform:translateX(-50%) translateY(12px); }
      to   { opacity:1; transform:translateX(-50%) translateY(0); }
    }

  </style>
</head>

// ─── Storage ──────────────────────────────────────────────────────────────────
const STORE_KEY = 'osts_clog_v2';
const BOOK_KEY  = 'osts_clog_bookmarks_v2';
let obtained  = new Set(storage.get(STORE_KEY, []));
let entryBMs  = new Set(storage.get(BOOK_KEY, []));

function save() { storage.set(STORE_KEY, [...obtained]); }
function saveBookmarks() { storage.set(BOOK_KEY, [...entryBMs]); }

function itemKey(entryId, idx) { return `${entryId}::${idx}`; }

function getEntryObtained(entry) {
  return entry.items.reduce((s, _, i) => s + (obtained.has(itemKey(entry.id, i)) ? 1 : 0), 0);
}

// ─── State ────────────────────────────────────────────────────────────────────
let activeFilter = 'all';
let searchQ      = '';
let sortMode     = 'alpha'; // 'alpha' | 'incomplete' | 'complete'

// ─── Render banner ────────────────────────────────────────────────────────────
function renderBanner() {
  const total   = obtained.size;
  const pct     = (total / TOTAL_SLOTS * 100).toFixed(1);
  const rank    = RANKS.slice().reverse().find(r => total >= r.threshold) || null;
  const nextR   = RANKS.find(r => total < r.threshold) || null;

  document.getElementById('cl-total-count').textContent = `${total.toLocaleString()} / ${TOTAL_SLOTS.toLocaleString()}`;
  document.getElementById('cl-total-sub').textContent   = `${pct}% complete`;
  document.getElementById('cl-progress-fill').style.width = pct + '%';

  const badgeEl = document.getElementById('cl-rank-badge');
  if (rank) {
    badgeEl.textContent = rank.name;
    badgeEl.style.background = rank.col;
    badgeEl.style.color = rank.col === '#1a1a2e' ? '#fff' : '#000';
  } else {
    badgeEl.textContent = 'Unranked';
    badgeEl.style.background = 'var(--surface2)';
    badgeEl.style.color = 'var(--muted)';
  }

  const nextEl = document.getElementById('cl-next-rank');
  if (nextR) {
    const need = nextR.threshold - total;
    nextEl.textContent = `${need} more for ${nextR.name}`;
  } else {
    nextEl.textContent = 'Max rank achieved! 🎉';
  }

  // Category breakdown chips
  const statsEl = document.getElementById('cl-cat-stats');
  statsEl.innerHTML = Object.entries(CAT_META).map(([cat, meta]) => {
    const catEntries = CLOG_DATA.filter(e => e.cat === cat);
    const catTotal   = catEntries.reduce((s, e) => s + e.items.length, 0);
    const catObt     = catEntries.reduce((s, e) => s + getEntryObtained(e), 0);
    const catPct     = catTotal > 0 ? (catObt / catTotal * 100).toFixed(0) : 0;
    return `
      <div class="cl-cat-stat${activeFilter === cat ? ' active' : ''}" data-cat="${cat}">
        <div class="cl-cat-stat-icon">${meta.icon}</div>
        <div class="cl-cat-stat-pct">${catPct}%</div>
        <div class="cl-cat-stat-name">${meta.label}</div>
        <div class="cl-cat-mini-bar"><div class="cl-cat-mini-fill" style="width:${catPct}%"></div></div>
      </div>`;
  }).join('');

  // Wire stat chip clicks
  statsEl.querySelectorAll('.cl-cat-stat').forEach(chip => {
    chip.addEventListener('click', () => {
      const cat = chip.dataset.cat;
      activeFilter = activeFilter === cat ? 'all' : cat;
      document.querySelectorAll('.cl-filter').forEach(f => f.classList.toggle('active', f.dataset.cat === activeFilter));
      renderBanner();
      renderList();
    });
  });
}

// ─── Filter & sort ────────────────────────────────────────────────────────────
function filteredEntries() {
  let list = CLOG_DATA.slice();
  if (activeFilter !== 'all') list = list.filter(e => e.cat === activeFilter);
  if (searchQ) {
    const q = searchQ.toLowerCase();
    list = list.filter(e =>
      e.name.toLowerCase().includes(q) ||
      e.items.some(it => it.toLowerCase().includes(q))
    );
  }
  if (sortMode === 'alpha')      list.sort((a,b) => a.name.localeCompare(b.name));
  if (sortMode === 'incomplete') list.sort((a,b) => {
    const ra = getEntryObtained(a) / a.items.length;
    const rb = getEntryObtained(b) / b.items.length;
    return ra - rb;
  });
  if (sortMode === 'complete')   list.sort((a,b) => {
    const ra = getEntryObtained(a) / a.items.length;
    const rb = getEntryObtained(b) / b.items.length;
    return rb - ra;
  });
  return list;
}

// ─── Wiki image URL helper ─────────────────────────────────────────────────────
// OSRS Wiki serves item sprites at a predictable path.
// Spaces → underscores, apostrophes kept, parentheses kept.
// onerror hides the img so layout never breaks on missing images.
function wikiImg(name) {
  const slug = name
    .replace(/ /g, '_')
    .replace(/'/g, "'");   // wiki keeps apostrophes in filenames
  return `https://oldschool.runescape.wiki/images/${encodeURIComponent(slug)}.png`;
}

    card.querySelector('.cl-card-top').addEventListener('click', () => {
      const wasOpen = card.classList.contains('open');
      // Close all first
      listEl.querySelectorAll('.cl-card.open').forEach(c => c.classList.remove('open'));
      if (!wasOpen) {
        card.classList.add('open');
        openCard = entryId;
      } else {
        openCard = null;
      }
    });

    // Item toggles
    card.querySelectorAll('.cl-item').forEach(item => {
      item.addEventListener('click', e => {
        e.stopPropagation();
        const entry = CLOG_DATA.find(e => e.id === entryId);
        const idx   = parseInt(item.dataset.idx);
        const key   = itemKey(entryId, idx);
        const wasGot = obtained.has(key);

        if (wasGot) obtained.delete(key);
        else        obtained.add(key);
        save();

        // Update item UI
        item.classList.toggle('got', !wasGot);
        item.querySelector('.cl-item-check').textContent = !wasGot ? '✓' : '';

        // Update card progress
        const got   = getEntryObtained(entry);
        const total = entry.items.length;
        const pct   = got / total * 100;
        const isDone = got === total;
        card.classList.toggle('done', isDone);

        const fill  = card.querySelector('.cl-entry-fill');
        const count = card.querySelector('.cl-entry-count');
        fill.style.width = pct + '%';
        fill.classList.toggle('complete', isDone);
        count.textContent = `${got} / ${total}`;
        count.classList.toggle('complete', isDone);

        // Check rank milestone
        checkRankMilestone();
        renderBanner();
      });
    });

    // Bookmark entry
    card.querySelector('[data-action="bookmark-entry"]')?.addEventListener('click', e => {
      e.stopPropagation();
      const entry = CLOG_DATA.find(e => e.id === entryId);
      if (entryBMs.has(entryId)) {
        entryBMs.delete(entryId);
        showToast(`${entry.name} removed from bookmarks`);
      } else {
        entryBMs.add(entryId);
        showToast(`${entry.name} bookmarked 🔖`);
      }
      saveBookmarks();
      // Update button in place without full re-render
      const btn = card.querySelector('[data-action="bookmark-entry"]');
      const saved = entryBMs.has(entryId);
      btn.textContent = `🔖 ${saved ? 'Saved' : 'Save Log'}`;
      btn.style.cssText = saved ? 'color:var(--gold);border-color:var(--gold);background:rgba(184,136,72,.12)' : '';
      btn.classList.toggle('bookmarked', saved);
    });

    // Mark all / clear buttons
    card.querySelector('[data-action="mark-all"]')?.addEventListener('click', e => {
      e.stopPropagation();
      const entry = CLOG_DATA.find(e => e.id === entryId);
      entry.items.forEach((_, i) => obtained.add(itemKey(entryId, i)));
      save();
      renderBanner();
      renderList();
      showToast(`${entry.name} marked complete ✓`);
    });
    card.querySelector('[data-action="clear-entry"]')?.addEventListener('click', e => {
      e.stopPropagation();
      const entry = CLOG_DATA.find(e => e.id === entryId);
      entry.items.forEach((_, i) => obtained.delete(itemKey(entryId, i)));
      save();
      renderBanner();
      renderList();
      showToast(`${entry.name} cleared`);
    });
  });
}

function entryCardHtml(e) {
  const got   = getEntryObtained(e);
  const total = e.items.length;
  const pct   = got / total * 100;
  const isDone = got === total;
  const col   = CAT_META[e.cat]?.col || 'var(--gold)';
  const isOpen = openCard === e.id;

  const itemsHtml = e.items.map((name, i) => {
    const key  = itemKey(e.id, i);
    const have = obtained.has(key);
    return `
    <div class="cl-item${have ? ' got' : ''}" data-idx="${i}">
      <img class="cl-item-img" src="${wikiImg(name)}" alt="" loading="lazy" onerror="this.style.display='none'">
      <div class="cl-item-check">${have ? '✓' : ''}</div>
      <div class="cl-item-name">${h(name)}</div>
    </div>`;
  }).join('');

  return `
  <div class="cl-card${isDone ? ' done' : ''}${isOpen ? ' open' : ''}" data-entry="${e.id}" style="--entry-col:${col}">
    <div class="cl-card-top">
      <div class="cl-entry-icon">${e.icon}</div>
      <div class="cl-entry-info">
        <div class="cl-entry-name">${h(e.name)}</div>
        <div class="cl-entry-bar-wrap">
          <div class="cl-entry-bar">
            <div class="cl-entry-fill${isDone ? ' complete' : ''}" style="width:${pct.toFixed(1)}%"></div>
          </div>
          <div class="cl-entry-count${isDone ? ' complete' : ''}">${got} / ${total}</div>
        </div>
      </div>
      <div class="cl-chevron">▾</div>
    </div>
    <div class="cl-items">${itemsHtml}</div>
    <div class="cl-card-actions">
      <button class="cl-act-btn${entryBMs.has(e.id) ? ' bookmarked' : ''}" data-action="bookmark-entry" style="${entryBMs.has(e.id) ? 'color:var(--gold);border-color:var(--gold);background:rgba(184,136,72,.12)' : ''}">🔖 ${entryBMs.has(e.id) ? 'Saved' : 'Save Log'}</button>
      <button class="cl-act-btn" data-action="mark-all">✓ Mark All</button>
      <button class="cl-act-btn danger" data-action="clear-entry">✕ Clear</button>
    </div>
  </div>`;
}

// ─── Rank milestone check ─────────────────────────────────────────────────────
let _lastRankIdx = -1;
function checkRankMilestone() {
  const total = obtained.size;
  const idx   = RANKS.slice().reverse().findIndex(r => total >= r.threshold);
  const rankIdx = idx >= 0 ? RANKS.length - 1 - idx : -1;
  if (rankIdx > _lastRankIdx) {
    _lastRankIdx = rankIdx;
    const rank = RANKS[rankIdx];
    showToast(`🎉 ${rank.name} rank achieved! (${rank.threshold} slots)`);
  }
}

// ─── Filters / search / sort ──────────────────────────────────────────────────
document.getElementById('cl-filters').addEventListener('click', e => {
  const btn = e.target.closest('.cl-filter');
  if (!btn) return;
  activeFilter = btn.dataset.cat;
  document.querySelectorAll('.cl-filter').forEach(b => b.classList.toggle('active', b.dataset.cat === activeFilter));
  openCard = null;
  renderBanner();
  renderList();
});

let searchTimer;
document.getElementById('cl-search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQ  = e.target.value.trim();
    openCard = null;
    renderList();
  }, 180);
});

const SORT_MODES = ['alpha','incomplete','complete'];
const SORT_LABELS = { alpha:'A–Z', incomplete:'Incomplete first', complete:'Complete first' };
document.getElementById('cl-sort-btn').addEventListener('click', () => {
  sortMode = SORT_MODES[(SORT_MODES.indexOf(sortMode) + 1) % SORT_MODES.length];
  document.getElementById('cl-sort-btn').textContent = `Sort: ${SORT_LABELS[sortMode]} ▾`;
  renderList();
});

// ─── Reset ────────────────────────────────────────────────────────────────────
document.getElementById('reset-clog-btn').addEventListener('click', () => {
  if (!confirm('Reset all collection log progress? This cannot be undone.')) return;
  obtained.clear();
  save();
  _lastRankIdx = -1;
  settings.close();
  renderBanner();
  renderList();
  showToast('Collection log reset');
});

// ─── Settings wiring ──────────────────────────────────────────────────────────
document.getElementById('settings-btn').addEventListener('click', ()=>settings.open());
document.getElementById('settings-close').addEventListener('click', ()=>settings.close());
document.getElementById('settings-overlay').addEventListener('click', ()=>settings.close());
document.querySelectorAll('.theme-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    const t = btn.dataset.theme;
    document.body.className = t==='dark'?'':`theme-${t}`;
    localStorage.setItem('osts_theme_v2', t);
  });
});

// ─── Utils ────────────────────────────────────────────────────────────────────
function h(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
// Seed _lastRankIdx from existing data so no false milestone on load
const initTotal = obtained.size;
_lastRankIdx = RANKS.slice().reverse().findIndex(r => initTotal >= r.threshold);
_lastRankIdx = _lastRankIdx >= 0 ? RANKS.length - 1 - _lastRankIdx : -1;

initPage({ activePage:'more' });
renderBanner();
renderList();
</script>
</body>
</html>
