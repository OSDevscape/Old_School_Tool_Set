<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2b241b">
  <link rel="manifest" href="../manifest.json">
  <title>OSTS — Skills</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* ── Skills grid — mobile first ── */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }
    @media (min-width: 480px)  { .skills-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 700px)  { .skills-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (min-width: 900px)  { .skills-grid { grid-template-columns: repeat(5, 1fr); } }

    /* ── Overall — always full width ── */
    .skill-card.overall {
      grid-column: 1 / -1;
      flex-direction: row;
      justify-content: flex-start;
      gap: 14px;
      padding: 12px 16px;
    }
    .skill-card.overall .sk-icon { width: 32px; height: 32px; }
    .skill-card.overall .ov-stats {
      display: flex; gap: 24px; flex-wrap: wrap; flex: 1;
    }
    .skill-card.overall .ov-stat { display: flex; flex-direction: column; }
    .skill-card.overall .ov-val  { font-size: 22px; font-weight: 700; }
    .skill-card.overall .ov-lbl  { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }

    /* ── Skill card ── */
    .skill-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 8px;
      display: flex; flex-direction: column; align-items: center;
      gap: 3px; cursor: pointer; position: relative; overflow: hidden;
      transition: border-color .15s; border-top-width: 3px;
    }
    .skill-card:active { background: var(--surface2); }
    .sk-icon  { width: 28px; height: 28px; object-fit: contain; }
    .sk-name  { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    .sk-lvl   { font-size: 20px; font-weight: 700; line-height: 1.1; }
    .sk-xp    { font-size: 10px; color: var(--muted); }
    .sk-rank  { font-size: 10px; color: var(--muted); }
    .xp-bar-wrap { position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--surface2); }
    .xp-bar-fill { height: 100%; border-radius: 0 0 12px 12px; }

    /* ── Profile cards ── */
    .sp-profile-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 11px; padding: 10px 12px; margin-bottom: 6px;
      display: flex; align-items: center; gap: 10px;
    }
    .sp-profile-card.active { border-color: var(--gold); }
    .sp-avatar {
      width: 34px; height: 34px; flex-shrink: 0; background: var(--surface3);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 17px;
    }
    .sp-info { flex: 1; min-width: 0; }
    .sp-nickname { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-rsn-type { font-size: 11px; color: var(--muted); }
    .sp-btn {
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text); font-size: 11px; font-weight: 600;
      padding: 5px 9px; cursor: pointer; transition: border-color .15s;
    }
    .sp-btn:hover { border-color: var(--gold); }

    /* ── AI Advice section ── */
    .ai-advice-wrap {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; margin-top: 4px;
    }
    .ai-advice-head {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px;
    }
    .ai-advice-head .ai-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--gold); flex-shrink: 0;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .ai-advice-head .ai-dot.done { animation: none; background: var(--green); }
    .ai-text {
      font-size: 13px; color: var(--text); line-height: 1.6;
      white-space: pre-wrap;
    }
    .ai-text.loading { color: var(--muted); font-style: italic; font-size: 12px; }
    .ai-method-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
    .ai-method {
      background: var(--surface3); border-radius: 8px; padding: 8px 10px;
    }
    .ai-method-name { font-size: 12px; font-weight: 700; color: var(--gold); margin-bottom: 2px; }
    .ai-method-xp   { font-size: 11px; color: var(--green); font-weight: 600; }
    .ai-method-desc { font-size: 11px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
    .ai-method-lvl  { font-size: 10px; color: var(--muted); }

    .sheet-section { margin-bottom: 14px; }
    .sheet-section-title {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
    }
    .sheet-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* R2M ring in sheet */
    .r2m-ring-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
    .r2m-ring-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
    .r2m-ring-wrap svg { position: absolute; top: 0; left: 0; transform: rotate(-90deg); }
    .r2m-ring-label {
      position: relative; z-index: 1; width: 64px; height: 64px;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-size: 15px; font-weight: 700; color: var(--gold);
    }
    .r2m-ring-label .sub { font-size: 9px; color: var(--muted); margin-top: 1px; }
    .r2m-stats { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .r2m-stat { display: flex; justify-content: space-between; font-size: 12px; }
    .r2m-stat .k { color: var(--muted); }
    .r2m-stat .v { font-weight: 700; color: var(--text); }
    .r2m-stat .v.gold { color: var(--gold); }
    .r2m-stat .v.green { color: var(--green); }

    /* XP progress bar in sheet */
    .sheet-prog-wrap { background: var(--surface2); border-radius: 6px; height: 8px; overflow: hidden; margin: 6px 0; }
    .sheet-prog-fill { height: 100%; border-radius: 6px; transition: width .4s; }
    .sheet-prog-labels { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
  </style>
</head>
<body>

<header>
  <h1>OSTS</h1>
  <div class="hdr-actions">
    <button id="install-btn">Install</button>
    <button class="hdr-btn icon-btn" id="settings-btn">⚙️</button>
  </div>
</header>

<div id="settings-overlay"></div>
<div id="settings-panel" aria-hidden="true">
  <div class="settings-head">
    <h2>Settings</h2>
    <button class="settings-close" id="settings-close">✕</button>
  </div>
  <div class="settings-block">
    <div class="settings-label">Appearance</div>
    <div class="theme-options">
      <button class="theme-chip" data-theme="dark">Dark</button>
      <button class="theme-chip" data-theme="light">Light</button>
      <button class="theme-chip" data-theme="brown">Brown</button>
    </div>
  </div>
  <div class="settings-block">
    <div class="settings-label">Player Profiles</div>
    <div id="sp-profile-list"></div>
  </div>
</div>

<div id="main">
  <div class="page active" id="page-skills">
    <div id="loader"></div>
    <div class="error-msg" id="error-msg"></div>

    <div class="welcome" id="welcome-msg">
      <div class="welcome-icon">
        <img src="https://gyazo.com/b153ebb94f7120c15bac90b921466f81.png"
             alt="Skills" class="welcome-logo" loading="lazy">
      </div>
      <p>Select a profile to view your skills.</p>
    </div>

    <div id="skills-grid" class="skills-grid" style="display:none"></div>
  </div>
</div>

<nav id="bottom-nav"></nav>

<div class="modal-overlay" id="more-menu-overlay">
  <div class="modal-sheet">
    <div class="modal-head">
      <div><div class="modal-title">More</div></div>
      <button class="modal-close" id="more-menu-close">✕</button>
    </div>
    <div class="modal-actions">
      <a class="modal-action" href="bossing.html">🏆 Bossing</a>
      <a class="modal-action" href="timers.html">⏱ Timers</a>
      <a class="modal-action" href="bestiary.html">🐉 Bestiary</a>
    </div>
  </div>
</div>

<!-- Skill Detail Sheet -->
<div class="skill-sheet-overlay" id="skill-sheet-overlay"></div>
<div class="skill-sheet" id="skill-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-icon" id="ss-icon"></div>
    <div class="sheet-title">
      <h2 id="ss-name">Skill</h2>
      <div class="sdesc" id="ss-desc"></div>
    </div>
    <button class="sheet-close" id="ss-close">✕</button>
  </div>
  <div class="sheet-body" id="ss-body"></div>
</div>

<div id="toast"></div>

<script type="module">
import {
  initPage, fetchPlayer, player, settings, showToast, storage,
  STORAGE_KEYS, SKILLS, SKILL_MAP, fmtXP, fmtNum, fmtRank,
  xpToLevel, xpForLevel, xpProgress, normalizeAccountType,
} from '../JS/shared.js';

initPage('skills');

const XP_FOR_99 = 13_034_431;

// ── Profile system ────────────────────────────────────────────────────────────
const PROFILES_KEY    = 'osts_profiles_v2';
const ACTIVE_PROF_KEY = 'osts_active_profile_v2';
const SP_ICONS  = { ironman:'🛡', hardcore:'💀', ultimate:'🔱', regular:'⚔', gim:'👥', ghcim:'☠', ugim:'👥' };
const SP_LABELS = { ironman:'Iron', hardcore:'HCIM', ultimate:'UIM', regular:'Regular', gim:'GIM', ghcim:'GHCIM', ugim:'UGIM' };

function getProfiles() { return storage.get(PROFILES_KEY, []); }
function getActiveId() { return storage.get(ACTIVE_PROF_KEY, null); }
function setActiveId(id) { storage.set(ACTIVE_PROF_KEY, id); }
function norm(t) { return normalizeAccountType(t); }

function renderProfilePanel() {
  const list = document.getElementById('sp-profile-list');
  if (!list) return;
  const profiles = getProfiles();
  const activeId = getActiveId();
  if (!profiles.length) {
    list.innerHTML = '<div style="font-size:12px;color:var(--muted)">No saved profiles.<br>Go to <a href="overview.html" style="color:var(--gold)">Overview</a> to create one.</div>';
    return;
  }
  const sorted = [...profiles].sort((a, b) => (b.id === activeId) - (a.id === activeId));
  list.innerHTML = sorted.map(p => `
    <div class="sp-profile-card${p.id === activeId ? ' active' : ''}">
      <div class="sp-avatar">${SP_ICONS[norm(p.type)] || '⚔'}</div>
      <div class="sp-info">
        <div class="sp-nickname">${p.nickname}</div>
        <div class="sp-rsn-type">${p.rsn} · ${SP_LABELS[norm(p.type)] || 'Iron'}</div>
      </div>
      ${p.id !== activeId
        ? `<button class="sp-btn" data-load="${p.id}">Load</button>`
        : '<span style="font-size:10px;color:var(--gold)">Active</span>'}
    </div>`).join('');

  list.querySelectorAll('[data-load]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = getProfiles().find(x => x.id === btn.dataset.load);
      if (!p) return;
      setActiveId(p.id);
      storage.set(STORAGE_KEYS.ACCOUNT_TYPE, norm(p.type));
      storage.set(STORAGE_KEYS.RSN, p.rsn);
      settings.close();
      loadPlayer(p.rsn, norm(p.type));
    });
  });
}

document.getElementById('settings-btn')
  ?.addEventListener('click', renderProfilePanel, true);

// ── Load player ───────────────────────────────────────────────────────────────
async function loadPlayer(rsn, accountType) {
  if (!rsn) rsn = storage.get(STORAGE_KEYS.RSN, '');
  if (!rsn) return;
  if (!accountType) accountType = storage.get(STORAGE_KEYS.ACCOUNT_TYPE, 'ironman');
  setLoading(true); clearError();
  try {
    const data = await fetchPlayer(rsn, accountType);
    player.set(data);
    renderSkills(data);
    showToast('✅ ' + (data.displayName || rsn));
  } catch (err) { showError(err.message); }
  finally { setLoading(false); }
}

// ── Render skills grid ────────────────────────────────────────────────────────
function renderSkills(data) {
  const snap = data.latestSnapshot?.data?.skills || {};
  const grid = document.getElementById('skills-grid');
  grid.style.display = '';
  document.getElementById('welcome-msg').style.display = 'none';

  // Overall card (full width)
  const ov    = snap.overall || {};
  const ovLvl = Number(ov.level || 0);
  const ovXp  = Number(ov.experience || 0);
  const ovRnk = ov.rank;
  const [, , ovIcon, ovColor] = SKILLS.find(([id]) => id === 'overall') || [];

  const overallCard = `<div class="skill-card overall" data-skill="overall" style="border-top-color:${ovColor}">
    <img class="sk-icon" src="${ovIcon}" alt="Overall" loading="lazy"
         onerror="this.style.display='none'">
    <div class="ov-stats">
      <div class="ov-stat">
        <div class="ov-lbl">Total Level</div>
        <div class="ov-val" style="color:${ovColor}">${fmtNum(ovLvl)}</div>
      </div>
      <div class="ov-stat">
        <div class="ov-lbl">Total XP</div>
        <div class="ov-val">${fmtXP(ovXp)}</div>
      </div>
      <div class="ov-stat">
        <div class="ov-lbl">Rank</div>
        <div class="ov-val">${fmtRank(ovRnk)}</div>
      </div>
    </div>
  </div>`;

  // Individual skill cards
  const skillCards = SKILLS.filter(([id]) => id !== 'overall').map(([id, name, icon, color]) => {
    const s    = snap[id] || {};
    const xp   = Number(s.experience || 0);
    const lvl  = Number(s.level || xpToLevel(xp));
    const rnk  = s.rank;
    const prog = lvl >= 99 ? 1 : xpProgress(xp, lvl);
    const iconH = icon
      ? `<img class="sk-icon" src="${icon}" alt="${name}" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="sk-icon" style="font-size:14px;font-weight:800;color:${color}">${name[0]}</div>`;

    return `<div class="skill-card" data-skill="${id}" style="border-top-color:${color}">
      ${iconH}
      <div class="sk-name">${name}</div>
      <div class="sk-lvl" style="color:${lvl >= 99 ? color : 'var(--text)'}">${lvl || '—'}</div>
      <div class="sk-xp">${fmtXP(xp)}</div>
      <div class="sk-rank">${fmtRank(rnk)}</div>
      <div class="xp-bar-wrap">
        <div class="xp-bar-fill" style="width:${(prog*100).toFixed(1)}%;background:${color}"></div>
      </div>
    </div>`;
  }).join('');

  grid.innerHTML = overallCard + skillCards;

  // All cards (including overall) open the sheet
  grid.querySelectorAll('[data-skill]').forEach(card => {
    card.addEventListener('click', () => openSkillSheet(card.dataset.skill, data));
  });
}

// ── Skill sheet ───────────────────────────────────────────────────────────────
function ringHtml(pct, color, size = 64) {
  const R = size / 2 - 6;
  const CIRC = 2 * Math.PI * R;
  const offset = CIRC * (1 - Math.max(0, Math.min(1, pct / 100)));
  return `<div class="r2m-ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="5"/>
      <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${color}" stroke-width="5"
        stroke-linecap="round"
        stroke-dasharray="${CIRC.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"/>
    </svg>
    <div class="r2m-ring-label" style="width:${size}px;height:${size}px">
      <span>${Math.round(pct)}%</span>
    </div>
  </div>`;
}

function openSkillSheet(skillId, data) {
  const found = SKILLS.find(s => s[0] === skillId);
  if (!found || !data) return;
  const [id, name, icon, color] = found;
  const snap = data.latestSnapshot?.data?.skills || {};

  // Overall sheet
  if (id === 'overall') {
    const ov    = snap.overall || {};
    const ovLvl = Number(ov.level || 0);
    const ovXp  = Number(ov.experience || 0);
    const ovRnk = ov.rank;

    // All skill entries for R2M
    const entries = SKILLS.filter(([sid]) => sid !== 'overall').map(([sid]) => {
      const s = snap[sid] || {};
      return { xp: Number(s.experience || 0), lvl: Number(s.level || xpToLevel(Number(s.experience || 0))) };
    });
    const skillCount  = entries.length;
    const r2mTotal    = entries.reduce((s, e) => s + Math.min(e.lvl, 99), 0);
    const r2mXpSum    = entries.reduce((s, e) => s + Math.min(e.xp, XP_FOR_99), 0);
    const r2mPct      = (r2mXpSum / (XP_FOR_99 * skillCount)) * 100;
    const maxed       = entries.filter(e => e.lvl >= 99).length;
    const levelsNeeded= (skillCount * 99) - r2mTotal;

    document.getElementById('ss-name').textContent = 'Overall';
    document.getElementById('ss-desc').textContent = `Total Level ${fmtNum(ovLvl)} · ${fmtXP(ovXp)} XP`;
    document.getElementById('ss-icon').innerHTML   = icon
      ? `<img src="${icon}" alt="Overall" style="width:32px;height:32px;object-fit:contain">` : '';

    document.getElementById('ss-body').innerHTML = `
      <div class="sheet-section">
        <div class="sheet-section-title">Stats</div>
        <div class="detail-stats">
          <div class="dstat"><div class="dval" style="color:${color}">${fmtNum(ovLvl)}</div><div class="dlbl">Total Level</div></div>
          <div class="dstat"><div class="dval">${fmtXP(ovXp)}</div><div class="dlbl">Total XP</div></div>
          <div class="dstat"><div class="dval">${fmtRank(ovRnk)}</div><div class="dlbl">Rank</div></div>
          <div class="dstat"><div class="dval">${maxed}</div><div class="dlbl">Maxed</div></div>
        </div>
      </div>

      <div class="sheet-section">
        <div class="sheet-section-title">Road to Max</div>
        <div class="r2m-ring-row">
          ${ringHtml(r2mPct, color)}
          <div class="r2m-stats">
            <div class="r2m-stat"><span class="k">Current Level</span><span class="v gold">${fmtNum(r2mTotal)}</span></div>
            <div class="r2m-stat"><span class="k">Max Level</span><span class="v">${fmtNum(skillCount * 99)}</span></div>
            <div class="r2m-stat"><span class="k">Levels Needed</span><span class="v">${fmtNum(levelsNeeded)}</span></div>
            <div class="r2m-stat"><span class="k">Maxed Skills</span><span class="v green">${maxed}/${skillCount}</span></div>
          </div>
        </div>
        <div class="sheet-prog-wrap">
          <div class="sheet-prog-fill" style="width:${r2mPct.toFixed(1)}%;background:${color}"></div>
        </div>
        <div class="sheet-prog-labels">
          <span>${r2mPct.toFixed(1)}% complete</span>
          <span>${fmtXP(XP_FOR_99 * skillCount - r2mXpSum)} XP remaining</span>
        </div>
      </div>`;

    openSheet();
    return;
  }

  // Individual skill sheet
  const s     = snap[id] || {};
  const xp    = Number(s.experience || 0);
  const lvl   = Number(s.level || xpToLevel(xp));
  const rnk   = s.rank;
  const pct   = (xp / XP_FOR_99) * 100; // XP toward 99
  const r2mPct= pct;
  const xpTo99= Math.max(0, XP_FOR_99 - xp);
  const inLvl = lvl >= 99 ? 0 : Math.max(0, xp - xpForLevel(lvl));
  const lvlSpan= lvl >= 99 ? 0 : Math.max(1, xpForLevel(lvl + 1) - xpForLevel(lvl));
  const lvlPct = lvl >= 99 ? 100 : (xpProgress(xp, lvl) * 100);
  const nextReq= lvl >= 99 ? 0 : Math.max(0, xpForLevel(lvl + 1) - xp);

  document.getElementById('ss-name').textContent = name;
  document.getElementById('ss-desc').textContent = `Level ${lvl} · ${fmtXP(xp)} XP`;
  document.getElementById('ss-icon').innerHTML   = icon
    ? `<img src="${icon}" alt="${name}" style="width:32px;height:32px;object-fit:contain">` : '';

  document.getElementById('ss-body').innerHTML = `
    <div class="sheet-section">
      <div class="sheet-section-title">Stats</div>
      <div class="detail-stats">
        <div class="dstat"><div class="dval" style="color:${color}">${lvl || '—'}</div><div class="dlbl">Level</div></div>
        <div class="dstat"><div class="dval">${fmtXP(xp)}</div><div class="dlbl">Total XP</div></div>
        <div class="dstat"><div class="dval">${fmtRank(rnk)}</div><div class="dlbl">Rank</div></div>
        <div class="dstat"><div class="dval" style="color:var(--blue)">${lvl >= 99 ? 'MAX' : fmtXP(nextReq)}</div><div class="dlbl">To Next Lvl</div></div>
      </div>
    </div>

    ${lvl < 99 ? `
    <div class="sheet-section">
      <div class="sheet-section-title">Level Progress</div>
      <div class="sheet-prog-wrap">
        <div class="sheet-prog-fill" style="width:${lvlPct.toFixed(1)}%;background:${color}"></div>
      </div>
      <div class="sheet-prog-labels">
        <span>${fmtXP(inLvl)} in level</span>
        <span>${lvlPct.toFixed(1)}%</span>
        <span>${fmtXP(lvlSpan)} total</span>
      </div>
    </div>` : ''}

    <div class="sheet-section">
      <div class="sheet-section-title">Road to 99</div>
      <div class="r2m-ring-row">
        ${ringHtml(r2mPct, color)}
        <div class="r2m-stats">
          <div class="r2m-stat"><span class="k">Current XP</span><span class="v">${fmtXP(xp)}</span></div>
          <div class="r2m-stat"><span class="k">XP to 99</span><span class="v gold">${lvl >= 99 ? 'MAX' : fmtXP(xpTo99)}</span></div>
          <div class="r2m-stat"><span class="k">Progress</span><span class="v green">${r2mPct.toFixed(1)}%</span></div>
          <div class="r2m-stat"><span class="k">Status</span><span class="v">${lvl >= 99 ? '🏆 Maxed' : `Level ${lvl}`}</span></div>
        </div>
      </div>
      <div class="sheet-prog-wrap">
        <div class="sheet-prog-fill" style="width:${Math.min(100, r2mPct).toFixed(1)}%;background:${color}"></div>
      </div>
      <div class="sheet-prog-labels">
        <span>${r2mPct.toFixed(1)}% to 99</span>
        <span>${fmtXP(XP_FOR_99)} needed</span>
      </div>
    </div>

    <div class="ai-advice-wrap" id="ai-advice-container">
      <div class="ai-advice-head">
        <div class="ai-dot"></div>
        AI Coach · ${name} Level ${lvl}
      </div>
      <div class="ai-text loading">Generating personalized advice…</div>
      <div class="ai-method-list"></div>
    </div>`;

  openSheet();

  // Fetch AI advice after sheet is open (non-blocking)
  if (id !== 'overall') {
    fetchSkillAdvice(id, name, lvl, xp, xpTo99, color);
  }
}

// ── AI Advice ─────────────────────────────────────────────────────────────────
async function fetchSkillAdvice(skillId, skillName, lvl, xp, xpTo99, color) {
  const wrap = document.getElementById('ai-advice-container');
  if (!wrap) return;

  const dot = wrap.querySelector('.ai-dot');
  const textEl = wrap.querySelector('.ai-text');
  const methodEl = wrap.querySelector('.ai-method-list');

  // Show loading state
  textEl.className = 'ai-text loading';
  textEl.textContent = 'Generating personalized advice…';
  methodEl.innerHTML = '';

  const prompt = `You are an Old School RuneScape expert coach. A player has level ${lvl} ${skillName} with ${Number(xp).toLocaleString()} XP. They need ${Number(xpTo99).toLocaleString()} XP to reach 99.

Respond ONLY with a JSON object in this exact format, no other text:
{
  "advice": "2-3 sentences of personal, specific advice for this player at level ${lvl} ${skillName}. Be encouraging and specific to their exact level range.",
  "methods": [
    {
      "name": "Method name",
      "minLevel": ${lvl},
      "xpRate": "~XX,XXX XP/hr",
      "description": "One sentence description of the method and why it suits level ${lvl}."
    }
  ]
}

Include 3-4 methods appropriate for level ${lvl} ${skillName}, sorted by XP rate descending. Methods must be unlocked at level ${lvl} or below.`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 600,
        messages: [{ role: 'user', content: prompt }],
      }),
    });

    if (!res.ok) throw new Error('API error ' + res.status);
    const data = await res.json();
    const raw  = data.content?.[0]?.text || '';

    // Parse JSON from response
    const jsonMatch = raw.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('No JSON in response');
    const parsed = JSON.parse(jsonMatch[0]);

    // Render advice text
    textEl.className  = 'ai-text';
    textEl.textContent = parsed.advice || '';

    // Render training methods
    if (parsed.methods?.length) {
      methodEl.innerHTML = parsed.methods.map(m => `
        <div class="ai-method">
          <div class="ai-method-name">${m.name}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="ai-method-xp">${m.xpRate}</span>
            ${m.minLevel ? `<span class="ai-method-lvl">Lv ${m.minLevel}+</span>` : ''}
          </div>
          <div class="ai-method-desc">${m.description}</div>
        </div>`).join('');
    }

    // Mark done
    if (dot) { dot.classList.add('done'); }

  } catch (err) {
    textEl.className  = 'ai-text';
    textEl.textContent = `Could not load advice: ${err.message}`;
    if (dot) { dot.style.background = 'var(--red)'; dot.style.animation = 'none'; }
  }
}

function openSheet() {
  document.getElementById('skill-sheet-overlay').classList.add('show');
  requestAnimationFrame(() => document.getElementById('skill-sheet').classList.add('show'));
}

function closeSheet() {
  document.getElementById('skill-sheet').classList.remove('show');
  document.getElementById('skill-sheet-overlay').classList.remove('show');
}

document.getElementById('ss-close').addEventListener('click', closeSheet);
document.getElementById('skill-sheet-overlay').addEventListener('click', closeSheet);

// ── UI helpers ────────────────────────────────────────────────────────────────
function setLoading(on) { document.getElementById('loader').classList.toggle('loading', on); }
function clearError() { const el = document.getElementById('error-msg'); el.textContent = ''; el.classList.remove('show'); }
function showError(msg) {
  const el = document.getElementById('error-msg'); el.textContent = msg; el.classList.add('show');
  document.getElementById('welcome-msg').style.display = '';
}

// ── Boot ──────────────────────────────────────────────────────────────────────
const cached = player.getFromCache();
if (cached) {
  renderSkills(cached);
} else {
  const lastRsn = storage.get(STORAGE_KEYS.RSN, '');
  if (lastRsn) loadPlayer(lastRsn);
}
</script>
