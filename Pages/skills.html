<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2b241b">
  <link rel="manifest" href="../manifest.json">
  <title>OSTS — Skills</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .sp-profile-card {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 11px; padding: 10px 12px; margin-bottom: 6px;
      display: flex; align-items: center; gap: 10px;
    }
    .sp-profile-card.active { border-color: var(--gold); }
    .sp-avatar {
      width: 34px; height: 34px; flex-shrink: 0; background: var(--surface3);
      border-radius: 8px; display: flex; align-items: center;
      justify-content: center; font-size: 17px;
    }
    .sp-info { flex: 1; min-width: 0; }
    .sp-nickname { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sp-rsn-type { font-size: 11px; color: var(--muted); }
    .sp-btn {
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: 7px; color: var(--text); font-size: 11px; font-weight: 600;
      padding: 5px 9px; cursor: pointer; transition: border-color .15s;
    }
    .sp-btn:hover { border-color: var(--gold); }
  </style>
</head>
<body>

<header>
  <h1>OSTS</h1>
  <div class="hdr-actions">
    <button id="install-btn">Install</button>
    <button class="hdr-btn icon-btn" id="settings-btn">⚙️</button>
  </div>
</header>

<div id="settings-overlay"></div>
<div id="settings-panel" aria-hidden="true">
  <div class="settings-head">
    <h2>Settings</h2>
    <button class="settings-close" id="settings-close">✕</button>
  </div>
  <div class="settings-block">
    <div class="settings-label">Appearance</div>
    <div class="theme-options">
      <button class="theme-chip" data-theme="dark">Dark</button>
      <button class="theme-chip" data-theme="light">Light</button>
      <button class="theme-chip" data-theme="brown">Brown</button>
    </div>
  </div>
  <div class="settings-block">
    <div class="settings-label">Player Profiles</div>
    <div id="sp-profile-list"></div>
  </div>
</div>

<div id="main">
  <div class="page active" id="page-skills">
    <div id="loader"></div>
    <div class="error-msg" id="error-msg"></div>
    <div class="welcome" id="welcome-msg">
      <div class="welcome-icon">
        <img src="https://gyazo.com/b153ebb94f7120c15bac90b921466f81.png" alt="Skills" class="welcome-logo" loading="lazy">
      </div>
      <p>Select a profile or open settings to load a player.</p>
    </div>
    <div id="skills-grid" class="skills-grid" style="display:none"></div>
  </div>
</div>

<nav id="bottom-nav"></nav>

<div class="modal-overlay" id="more-menu-overlay">
  <div class="modal-sheet">
    <div class="modal-head">
      <div><div class="modal-title">More</div></div>
      <button class="modal-close" id="more-menu-close">✕</button>
    </div>
    <div class="modal-actions">
      <a class="modal-action" href="bossing.html">🏆 Bossing</a>
      <a class="modal-action" href="timers.html">⏱ Timers</a>
      <a class="modal-action" href="bestiary.html">🐉 Bestiary</a>
    </div>
  </div>
</div>

<!-- Skill Detail Sheet -->
<div class="skill-sheet-overlay" id="skill-sheet-overlay"></div>
<div class="skill-sheet" id="skill-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-icon" id="ss-icon"></div>
    <div class="sheet-title">
      <h2 id="ss-name">Skill</h2>
      <div class="sdesc" id="ss-desc"></div>
    </div>
    <button class="sheet-close" id="ss-close">✕</button>
  </div>
  <div class="sheet-body" id="ss-body"></div>
</div>

<div id="toast"></div>

<script type="module">
import {
  initPage, fetchPlayer, player, settings, showToast, storage,
  STORAGE_KEYS, SKILLS, SKILL_MAP, fmtXP, fmtRank,
  xpToLevel, xpForLevel, xpProgress, normalizeAccountType,
} from '../JS/shared.js';

initPage('skills');

// ── Profile system ────────────────────────────────────────────────────────────
const PROFILES_KEY    = 'osts_profiles_v2';
const ACTIVE_PROF_KEY = 'osts_active_profile_v2';
const SP_ICONS  = { ironman:'🛡', hardcore:'💀', ultimate:'🔱', regular:'⚔', gim:'👥', ghcim:'☠', ugim:'👥' };
const SP_LABELS = { ironman:'Iron', hardcore:'HCIM', ultimate:'UIM', regular:'Regular', gim:'GIM', ghcim:'GHCIM', ugim:'UGIM' };

function getProfiles() { return storage.get(PROFILES_KEY, []); }
function getActiveId() { return storage.get(ACTIVE_PROF_KEY, null); }
function setActiveId(id) { storage.set(ACTIVE_PROF_KEY, id); }
function norm(t) { return normalizeAccountType(t); }

function renderProfilePanel() {
  const list = document.getElementById('sp-profile-list');
  if (!list) return;
  const profiles = getProfiles();
  const activeId = getActiveId();
  if (!profiles.length) {
    list.innerHTML = '<div style="font-size:12px;color:var(--muted)">No saved profiles.<br>Go to <a href="overview.html" style="color:var(--gold)">Overview</a> to create one.</div>';
    return;
  }
  const sorted = [...profiles].sort((a, b) => (b.id === activeId) - (a.id === activeId));
  list.innerHTML = sorted.map(p => `
    <div class="sp-profile-card${p.id === activeId ? ' active' : ''}">
      <div class="sp-avatar">${SP_ICONS[norm(p.type)] || '⚔'}</div>
      <div class="sp-info">
        <div class="sp-nickname">${p.nickname}</div>
        <div class="sp-rsn-type">${p.rsn} · ${SP_LABELS[norm(p.type)] || 'Iron'}</div>
      </div>
      ${p.id !== activeId
        ? `<button class="sp-btn" data-load="${p.id}">Load</button>`
        : '<span style="font-size:10px;color:var(--gold)">Active</span>'}
    </div>`).join('');

  list.querySelectorAll('[data-load]').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = getProfiles().find(x => x.id === btn.dataset.load);
      if (!p) return;
      setActiveId(p.id);
      storage.set(STORAGE_KEYS.ACCOUNT_TYPE, norm(p.type));
      storage.set(STORAGE_KEYS.RSN, p.rsn);
      settings.close();
      loadPlayer(p.rsn, norm(p.type));
    });
  });
}

document.getElementById('settings-btn')
  ?.addEventListener('click', renderProfilePanel, true);

// ── Load player ───────────────────────────────────────────────────────────────
async function loadPlayer(rsn, accountType) {
  if (!rsn) rsn = storage.get(STORAGE_KEYS.RSN, '');
  if (!rsn) return;
  if (!accountType) accountType = storage.get(STORAGE_KEYS.ACCOUNT_TYPE, 'ironman');
  setLoading(true); clearError();
  try {
    const data = await fetchPlayer(rsn, accountType);
    player.set(data);
    renderSkills(data);
    showToast('✅ ' + (data.displayName || rsn));
  } catch (err) { showError(err.message); }
  finally { setLoading(false); }
}

// ── Render skills ─────────────────────────────────────────────────────────────
function renderSkills(data) {
  const snap = data.latestSnapshot?.data?.skills || {};
  const grid = document.getElementById('skills-grid');
  grid.style.display = '';
  document.getElementById('welcome-msg').style.display = 'none';

  grid.innerHTML = SKILLS.map(([id, name, icon, color]) => {
    const skillData = snap[id] || {};
    const xp   = Number(skillData.experience || 0);
    const lvl  = Number(skillData.level || (id === 'overall' ? 0 : xpToLevel(xp)));
    const rnk  = skillData.rank;
    const prog = id === 'overall' || lvl >= 99 ? 1 : xpProgress(xp, lvl);
    const iconH = icon
      ? `<img class="sk-icon" src="${icon}" alt="${name}" loading="lazy">`
      : `<div class="sk-icon" style="font-size:14px;font-weight:800;color:${color}">${name[0]}</div>`;

    if (id === 'overall') {
      return `<div class="skill-card overall" style="border-top-color:${color}40">
        ${iconH}
        <div>
          <div class="sk-name" style="font-size:12px">Overall</div>
          <div class="sk-lvl" style="color:${color}">${lvl || '—'}</div>
        </div>
        <div style="margin-left:12px">
          <div class="sk-xp">${fmtXP(xp)} XP</div>
          <div class="sk-rank">${rnk > 0 ? '#' + Number(rnk).toLocaleString() : 'Unranked'}</div>
        </div>
      </div>`;
    }

    return `<div class="skill-card" data-skill="${id}" style="border-top-color:${color}">
      ${iconH}
      <div class="sk-name">${name}</div>
      <div class="sk-lvl" style="color:${color}">${lvl || '—'}</div>
      <div class="sk-xp">${fmtXP(xp)}</div>
      <div class="sk-rank">${rnk > 0 ? '#' + Number(rnk).toLocaleString() : 'Unranked'}</div>
      <div class="xp-bar-wrap">
        <div class="xp-bar-fill" style="width:${(prog * 100).toFixed(1)}%;background:${color}"></div>
      </div>
    </div>`;
  }).join('');

  grid.querySelectorAll('[data-skill]').forEach(card => {
    card.addEventListener('click', () => openSkillSheet(card.dataset.skill, data));
  });
}

// ── Skill detail sheet ────────────────────────────────────────────────────────
function openSkillSheet(skillId, data) {
  const found = SKILLS.find(s => s[0] === skillId);
  if (!found || !data) return;
  const [id, name, icon, color] = found;
  const snap     = data.latestSnapshot?.data?.skills || {};
  const skillData= snap[id] || {};
  const xp       = Number(skillData.experience || 0);
  const lvl      = Number(skillData.level || xpToLevel(xp));
  const rnk      = skillData.rank;
  const nextReq  = lvl >= 99 ? 0 : Math.max(0, xpForLevel(lvl + 1) - xp);
  const inLvl    = lvl >= 99 ? 0 : Math.max(0, xp - xpForLevel(lvl));
  const span     = lvl >= 99 ? 0 : Math.max(1, xpForLevel(lvl + 1) - xpForLevel(lvl));
  const pct      = lvl >= 99 ? 100 : (xpProgress(xp, lvl) * 100);

  document.getElementById('ss-name').textContent = name;
  document.getElementById('ss-desc').textContent = `Level ${lvl} · ${fmtXP(xp)} XP`;
  document.getElementById('ss-icon').innerHTML   = icon
    ? `<img src="${icon}" alt="${name}" style="width:32px;height:32px;object-fit:contain">` : '';

  let body = `<div class="detail-stats">
    <div class="dstat"><div class="dval" style="color:${color}">${lvl || '—'}</div><div class="dlbl">Level</div></div>
    <div class="dstat"><div class="dval">${fmtXP(xp)}</div><div class="dlbl">Total XP</div></div>
    <div class="dstat"><div class="dval">${fmtRank(rnk)}</div><div class="dlbl">Rank</div></div>
    <div class="dstat"><div class="dval" style="color:var(--blue)">${lvl >= 99 ? 'MAX' : fmtXP(nextReq)}</div><div class="dlbl">To Next</div></div>
  </div>`;

  if (id !== 'overall' && lvl < 99) {
    body += `<div style="margin:12px 0">
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">XP Progress to Level ${lvl + 1}</div>
      <div class="progress-wrap"><div class="progress-fill" style="width:${pct.toFixed(1)}%;background:${color}"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px">
        <span>${fmtXP(inLvl)} in level</span>
        <span>${pct.toFixed(1)}%</span>
        <span>${fmtXP(span)} total</span>
      </div>
    </div>`;
  }

  document.getElementById('ss-body').innerHTML = body;
  document.getElementById('skill-sheet-overlay').classList.add('show');
  requestAnimationFrame(() => document.getElementById('skill-sheet').classList.add('show'));
}

function closeSkillSheet() {
  document.getElementById('skill-sheet').classList.remove('show');
  document.getElementById('skill-sheet-overlay').classList.remove('show');
}

document.getElementById('ss-close').addEventListener('click', closeSkillSheet);
document.getElementById('skill-sheet-overlay').addEventListener('click', closeSkillSheet);

// ── UI helpers ────────────────────────────────────────────────────────────────
function setLoading(on) { document.getElementById('loader').classList.toggle('loading', on); }
function clearError() { const el = document.getElementById('error-msg'); el.textContent = ''; el.classList.remove('show'); }
function showError(msg) { const el = document.getElementById('error-msg'); el.textContent = msg; el.classList.add('show'); document.getElementById('welcome-msg').style.display = ''; }

// ── Boot ──────────────────────────────────────────────────────────────────────
const cached = player.getFromCache();
if (cached) {
  renderSkills(cached);
} else {
  const lastRsn = storage.get(STORAGE_KEYS.RSN, '');
  if (lastRsn) loadPlayer(lastRsn);
}
</script>
</body>
</html>
